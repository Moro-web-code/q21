<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rail — Pedidos por mesa</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

<style>
  :root{
    --ink:#211f1c;
    --ink-2:#2b2823;
    --paper:#f0e9d8;
    --paper-shadow:#d8cfb8;
    --rust:#c1502e;
    --mustard:#d6a130;
    --sage:#5c7a5a;
    --ink-soft:#55504a;
    --cream-text:#f0e9d8;
  }

  *{box-sizing:border-box;}
  html,body{ margin:0; padding:0; }
  body{
    background:var(--ink);
    color:var(--cream-text);
    font-family:'JetBrains Mono',monospace;
    min-height:100vh;
  }
  .display{ font-family:'Archivo',sans-serif; font-weight:900; letter-spacing:-0.02em; }
  .eyebrow{ font-size:11px; letter-spacing:.18em; text-transform:uppercase; color:var(--mustard); font-weight:700; }
  a{ color:inherit; }
  button{ font-family:inherit; cursor:pointer; border:none; }
  ::selection{ background:var(--rust); color:var(--paper); }

  .screen{ max-width:1100px; margin:0 auto; padding:28px 20px 80px; }
  .topbar{ display:flex; align-items:baseline; justify-content:space-between; padding-bottom:18px; margin-bottom:26px; border-bottom:1px dashed #4a453d; }
  .brand{ display:flex; align-items:baseline; gap:10px; }
  .brand .display{ font-size:22px; }

  .ticket{ background:var(--paper); color:var(--ink); position:relative; border-radius:2px; box-shadow:0 10px 24px rgba(0,0,0,.35),0 1px 0 rgba(255,255,255,.4) inset; }
  .ticket::before,.ticket::after{ content:""; position:absolute; left:0; right:0; height:10px; background:radial-gradient(circle at 8px 5px,var(--ink) 5px,transparent 5.5px) repeat-x; background-size:16px 10px; }
  .ticket::before{ top:-5px; }
  .ticket::after{ bottom:-5px; transform:rotate(180deg); }

  .hero{ padding:10px 0 36px; }
  .hero .display{ font-size:clamp(34px,6vw,54px); line-height:1; }
  .hero p{ color:var(--paper-shadow); max-width:520px; font-size:14px; line-height:1.6; }

  .table-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:22px; margin-top:10px; }
  .table-card{ padding:22px 18px 26px; text-align:center; }
  .table-card .num{ font-family:'Archivo',sans-serif; font-weight:900; font-size:13px; letter-spacing:.14em; color:var(--rust); text-transform:uppercase; }
  .table-card .name{ font-family:'Archivo',sans-serif; font-weight:900; font-size:28px; margin:2px 0 14px; }
  .table-card img{ width:150px; height:150px; image-rendering:pixelated; border:6px solid #fff; display:block; margin:0 auto 12px; }
  .table-card .url{ font-size:10px; word-break:break-all; color:var(--ink-soft); }

  .admin-link{ display:inline-flex; align-items:center; gap:8px; margin-top:34px; background:transparent; border:1px solid var(--paper-shadow); color:var(--cream-text); padding:12px 18px; border-radius:2px; text-decoration:none; font-size:13px; }
  .admin-link:hover{ border-color:var(--mustard); color:var(--mustard); }

  .note-box{ margin-top:40px; border-left:3px solid var(--mustard); padding:10px 16px; font-size:12px; color:var(--paper-shadow); line-height:1.6; background:rgba(255,255,255,.03); }

  .mesa-title{ display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; }
  .mesa-title .display{ font-size:clamp(28px,5vw,40px); }

  .cat-block{ margin:26px 0; }
  .cat-block h3{ font-family:'Archivo',sans-serif; font-size:13px; letter-spacing:.16em; text-transform:uppercase; color:var(--mustard); border-bottom:1px dashed #4a453d; padding-bottom:8px; margin-bottom:4px; }

  .item-row{ display:flex; align-items:center; justify-content:space-between; gap:14px; padding:14px 4px; border-bottom:1px dashed #3a362f; }
  .item-row .meta .name{ font-size:14px; font-weight:500; }
  .item-row .meta .price{ font-size:12px; color:var(--paper-shadow); margin-top:2px; }

  .stepper{ display:flex; align-items:center; gap:10px; }
  .stepper button{ width:30px; height:30px; border-radius:2px; background:var(--paper); color:var(--ink); font-size:16px; font-weight:700; line-height:1; }
  .stepper button:disabled{ opacity:.3; cursor:default; }
  .stepper .qty{ min-width:16px; text-align:center; font-size:14px; }

  .cart-bar{ position:fixed; left:0; right:0; bottom:0; background:var(--paper); color:var(--ink); padding:14px 20px; display:flex; align-items:center; justify-content:space-between; box-shadow:0 -8px 24px rgba(0,0,0,.35); }
  .cart-bar .total{ font-family:'Archivo',sans-serif; font-weight:900; font-size:18px; }
  .cart-bar .total span{ display:block; font-family:'JetBrains Mono'; font-weight:400; font-size:10px; letter-spacing:.1em; color:var(--ink-soft); text-transform:uppercase; }

  .send-btn{ background:var(--rust); color:var(--paper); padding:12px 22px; border-radius:2px; font-weight:700; font-size:13px; letter-spacing:.04em; text-transform:uppercase; }
  .send-btn:disabled{ background:#6b5f52; cursor:default; }

  .notes-field{ width:100%; background:transparent; border:1px dashed #4a453d; color:var(--cream-text); padding:10px 12px; font-family:inherit; font-size:12px; border-radius:2px; margin-top:18px; resize:vertical; min-height:44px; }
  .notes-field::placeholder{ color:#665f54; }

  .confirm-wrap{ padding:20px 0; }
  .confirm-ticket{ padding:26px 22px 30px; max-width:380px; margin:0 auto; }
  .confirm-ticket .eyebrow{ color:var(--rust); }
  .confirm-ticket .ordid{ font-family:'Archivo',sans-serif; font-weight:900; font-size:30px; margin:4px 0 16px; }
  .confirm-ticket ul{ list-style:none; padding:0; margin:0 0 14px; font-size:13px; }
  .confirm-ticket li{ display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px dotted #ccc4ac; }

  .status-pill{ display:inline-block; padding:6px 14px; border-radius:999px; font-size:11px; text-transform:uppercase; letter-spacing:.08em; font-weight:700; margin-top:8px; }
  .status-pendiente{ background:var(--mustard); color:#26200e; }
  .status-preparando{ background:var(--rust); color:var(--paper); }
  .status-listo{ background:var(--sage); color:var(--paper); }

  .new-order-btn{ display:block; margin:22px auto 0; background:transparent; border:1px solid var(--paper-shadow); color:var(--cream-text); padding:10px 16px; border-radius:2px; font-size:12px; }

  .board{ display:grid; grid-template-columns:repeat(3,1fr); gap:20px; align-items:start; }
  @media (max-width:820px){ .board{ grid-template-columns:1fr; } }

  .col-head{ font-family:'Archivo',sans-serif; font-weight:900; font-size:13px; letter-spacing:.1em; text-transform:uppercase; padding-bottom:10px; border-bottom:2px solid; margin-bottom:16px; display:flex; justify-content:space-between; align-items:center; }
  .col-head .count{ font-family:'JetBrains Mono'; font-size:11px; font-weight:400; opacity:.7; }
  .col-pendiente .col-head{ color:var(--mustard); border-color:var(--mustard); }
  .col-preparando .col-head{ color:var(--rust); border-color:var(--rust); }
  .col-listo .col-head{ color:var(--sage); border-color:var(--sage); }

  .order-ticket{ padding:16px 16px 18px; margin-bottom:20px; }
  .order-ticket .row1{ display:flex; justify-content:space-between; align-items:flex-start; }
  .order-ticket .mesa{ font-family:'Archivo',sans-serif; font-weight:900; font-size:18px; }
  .order-ticket .elapsed{ font-size:11px; color:var(--ink-soft); }
  .order-ticket ul{ list-style:none; padding:0; margin:10px 0; font-size:12.5px; }
  .order-ticket li{ display:flex; justify-content:space-between; padding:3px 0; }
  .order-ticket .notes{ font-size:11.5px; font-style:italic; color:var(--ink-soft); margin-bottom:10px; }
  .order-ticket .action{ width:100%; padding:10px; border-radius:2px; font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; }

  .action-preparar{ background:var(--mustard); color:#26200e; }
  .action-listo{ background:var(--rust); color:var(--paper); }
  .action-entregado{ background:var(--sage); color:var(--paper); }

  .empty-col{ font-size:12px; color:#665f54; padding:20px 4px; border:1px dashed #3a362f; text-align:center; border-radius:2px; }
  .staff-sub{ color:var(--paper-shadow); font-size:12px; margin-top:-14px; margin-bottom:24px; }

  /* Mensaje de error inline */
  .error-msg{ background:rgba(193,80,46,.15); border:1px solid var(--rust); color:var(--rust); padding:10px 14px; border-radius:2px; font-size:12px; margin-top:12px; display:none; }
  .error-msg.visible{ display:block; }
</style>
</head>

<body>
<div id="app" class="screen">Cargando…</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(async function(){

  const RESTAURANT  = "RAIL";
  const SUPABASE_URL = "https://ubvxxamgguqgyayzgdxi.supabase.co";
  const SUPABASE_KEY = "sb_publishable_a9bjE0XB_Q42trAFqZ172Q_XyZcYt1V";

  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  window.appSupabase = supabase;

  const MESAS = [
    {id:1, nombre:"Mesa 1"},
    {id:2, nombre:"Mesa 2"},
    {id:3, nombre:"Mesa 3"},
    {id:4, nombre:"Mesa 4"},
  ];

  const app    = document.getElementById('app');
  const params = new URLSearchParams(window.location.search);

  const tokenParam    = params.get('token');
  const isAdmin       = params.get('admin') === '1';
  const isAdministrador = params.get('administrador') === '1';
  const isMesero       = params.get('mesero') === '1';
  const baseUrl       = window.location.origin + window.location.pathname;

  // ── Referencia al intervalo de cocina para poder limpiarlo ──
  let staffInterval = null;

  /* ============================================================
     CORRECCIÓN 1: Sanitización contra XSS
     Escapa caracteres HTML antes de insertar texto en el DOM.
  ============================================================ */
  function esc(str){
    return String(str ?? '')
      .replace(/&/g,'&amp;')
      .replace(/</g,'&lt;')
      .replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;')
      .replace(/'/g,'&#39;');
  }

  function fmt(n){
    return 'S/ ' + Number(n).toFixed(2);
  }

  function qrUrl(targetUrl){
    return 'https://api.qrserver.com/v1/create-qr-code/?size=220x220&margin=8&data='
      + encodeURIComponent(targetUrl);
  }

  function elapsedLabel(iso){
    const s = Math.max(0, Math.floor((Date.now() - new Date(iso).getTime()) / 1000));
    const m = Math.floor(s / 60);
    const r = s % 60;
    return m + ':' + String(r).padStart(2,'0');
  }


  /* ============================================================
     CORRECCIÓN 2: getTableByToken usa la RPC validate_qr_token
     en vez de consultar table_qr_tokens directamente.
  ============================================================ */
 async function getTableByToken(token){
  const cleanToken = String(token || '').trim();

  const { data, error } = await supabase.rpc('validate_qr_token', {
    p_token: cleanToken
  });

  if(error || !data){
    return {
      valid: false,
      reason: 'error'
    };
  }

  if(!data.valid){
    return {
      valid: false,
      reason: data.reason || 'qr_invalido'
    };
  }

  const tableId = Number(data.table_id);

  const mesa = MESAS.find(
    m => Number(m.id) === tableId
  );

  if(!mesa){
    return {
      valid: false,
      reason: 'qr_invalido'
    };
  }

  return {
    valid: true,
    mesa
  };
}

  /* ============================================================
     CORRECCIÓN 3: getTableTokens usa la RPC get_table_qr_codes
     en vez de consultar table_qr_tokens directamente.
  ============================================================ */
  async function getTableTokens(){
    const { data, error } = await supabase.rpc('get_table_qr_codes');

    if(error){
      // Solo loguear en desarrollo, nunca mostrar al usuario
      if(location.hostname === 'localhost' || location.hostname === '127.0.0.1'){
        console.error('Error leyendo tokens:', error);
      }
      return [];
    }

    return data || [];
  }

  async function getMenu(){
    const { data, error } = await supabase
      .from('menu_items')
      .select('id, name, category, price')
      .eq('active', true)
      .order('id');

    if(error) return [];

    const categories = {};
    data.forEach(item => {
      if(!categories[item.category]) categories[item.category] = [];
      categories[item.category].push({
        id: item.id,
        name: item.name,
        price: Number(item.price)
      });
    });

    return Object.entries(categories).map(([cat, items]) => ({ cat, items }));
  }

  async function getOrders(){
    const { data, error } = await supabase
      .from('orders')
      .select('*')
      .order('created_at', { ascending: true });

    if(error) return [];

    return data.map(o => ({
      id:        o.id,
      table:     o.table_name,
      tableId:   o.table_id,
      items:     o.items,
      total:     Number(o.total),
      notes:     o.notes || '',
      status:    o.status,
      createdAt: o.created_at
    }));
  }

  async function getOrder(orderId){
    const token = localStorage.getItem('order_token_' + orderId);
    if(!token) return null;

    const { data, error } = await supabase.rpc('get_order_by_token', {
      p_order_id:    orderId,
      p_access_token: token
    });

    if(error || !data || data.length === 0) return null;

    const o = data[0];
    return {
      id:        o.id,
      table:     o.table_name,
      tableId:   o.table_id,
      items:     o.items,
      total:     Number(o.total),
      notes:     o.notes || '',
      status:    o.status,
      createdAt: o.created_at
    };
  }


  /* ============================================================
     CORRECCIÓN 4: Bloqueo de navegación del cliente
  ============================================================ */
  function bloquearNavegacionMesa(token){
    const urlMesa = baseUrl + '?token=' + encodeURIComponent(token);
    history.replaceState(null, '', urlMesa);
    history.pushState(null, '', urlMesa);
    window.addEventListener('popstate', function(){
      history.pushState(null, '', urlMesa);
    });
  }


  /* ============================================================
     HOME
  ============================================================ */
  async function renderHome(){
    const tokens = await getTableTokens();

    app.innerHTML = `
      <div class="topbar">
        <div class="brand">
          <span class="display">${esc(RESTAURANT)}</span>
        </div>
      </div>

      <div class="hero">
        <div class="eyebrow">Pedidos por QR</div>
        <div class="display">Escanea, pide,<br>llega a cocina.</div>
        <p>Cada mesa tiene su propio código QR. El cliente escanea, arma su pedido desde el menú y este aparece al instante en el panel de cocina.</p>
      </div>

      <div class="table-grid">
        ${MESAS.map(m => {
          const tokenData = tokens.find(t => t.table_id === m.id);
          if(!tokenData){
            return `
              <div class="ticket table-card">
                <div class="num">Mesa N.º ${m.id}</div>
                <div class="name">${esc(m.nombre)}</div>
                <div style="color:var(--rust);font-size:11px;">Sin token</div>
              </div>`;
          }
          const url = new URL(baseUrl);
          url.search = '';
          url.searchParams.set('token', tokenData.token);
          return `
            <div class="ticket table-card">
              <div class="num">Mesa N.º ${m.id}</div>
              <div class="name">${esc(m.nombre)}</div>
              <img src="${qrUrl(url.toString())}" alt="QR ${esc(m.nombre)}">
            </div>`;
        }).join('')}
      </div>

<a class="admin-link" href="${baseUrl}?admin=1">→ Abrir panel de cocina</a>

<a class="admin-link" href="${baseUrl}?mesero=1">→ Abrir panel de mesero</a>

<a class="admin-link" href="${baseUrl}?administrador=1">→ Abrir panel administrativo</a>

      <div class="note-box">
        Los QR codifican la URL actual de esta página.
        Para que funcionen al escanearlos con un celular real,
        comparte/publica este artefacto primero.
      </div>
    `;
  }


  /* ============================================================
     CUSTOMER
  ============================================================ */
  async function renderCustomer(mesaId){
    const mesa = MESAS.find(m => m.id === mesaId) || { id: mesaId, nombre: 'Mesa ' + mesaId };
    const menu = await getMenu();
    const cart = {};

    function cartTotal(){
      return Object.values(cart).reduce((s,i) => s + i.price * i.qty, 0);
    }
    function cartCount(){
      return Object.values(cart).reduce((s,i) => s + i.qty, 0);
    }

    function draw(){
      app.innerHTML = `
        <div class="topbar">
          <div class="brand"><span class="display">${esc(RESTAURANT)}</span></div>
        </div>

        <div class="mesa-title">
          <div>
            <div class="eyebrow">Estás pidiendo desde</div>
            <div class="display">${esc(mesa.nombre)}</div>
          </div>
        </div>

        <div id="menu-wrap"></div>

        <textarea id="notes" class="notes-field"
          placeholder="Notas para cocina (opcional): sin cebolla, poco picante, etc."
          maxlength="300"
        ></textarea>

        <div style="height:90px;"></div>

        <div class="cart-bar">
          <div class="total">
            <span>${cartCount()} ítem(s)</span>
            ${fmt(cartTotal())}
          </div>
          <button class="send-btn" id="send-btn" ${cartCount()===0?'disabled':''}>
            Enviar pedido
          </button>
        </div>
      `;

      const wrap = document.getElementById('menu-wrap');

      /* CORRECCIÓN 1 aplicada: esc() en todos los textos del menú */
      wrap.innerHTML = menu.map(cat => `
        <div class="cat-block">
          <h3>${esc(cat.cat)}</h3>
          ${cat.items.map(it => {
            const qty = cart[it.name]?.qty || 0;
            return `
              <div class="item-row" data-name="${esc(it.name)}">
                <div class="meta">
                  <div class="name">${esc(it.name)}</div>
                  <div class="price">${fmt(it.price)}</div>
                </div>
                <div class="stepper">
                  <button class="dec" ${qty===0?'disabled':''}>−</button>
                  <span class="qty">${qty}</span>
                  <button class="inc">+</button>
                </div>
              </div>`;
          }).join('')}
        </div>`).join('');

      wrap.querySelectorAll('.item-row').forEach(row => {
        const name = row.dataset.name;
        const item = menu.flatMap(c => c.items).find(i => i.name === name);

        row.querySelector('.inc').onclick = () => {
          if(!cart[name]){
            cart[name] = { menuItemId: item.id, name: item.name, price: item.price, qty: 0 };
          }
          cart[name].qty++;
          draw();
        };

        row.querySelector('.dec').onclick = () => {
          if(!cart[name]) return;
          cart[name].qty--;
          if(cart[name].qty <= 0) delete cart[name];
          draw();
        };
      });

      document.getElementById('send-btn').onclick = sendOrder;
    }

    async function sendOrder(){
      const btn = document.getElementById('send-btn');
      btn.disabled = true;
      btn.textContent = 'Enviando…';

      /* CORRECCIÓN 1 aplicada: notas tienen maxlength en HTML
         y se truncan por seguridad también en JS              */
      const notes = (document.getElementById('notes').value || '').trim().slice(0, 300);

      const accessToken = crypto.randomUUID();

      /* CORRECCIÓN 5: ID generado con randomUUID en vez de
         Date.now() + Math.random()                          */
      const orderId = crypto.randomUUID();

      const order = {
        id:           orderId,
        table_name:   mesa.nombre,
        table_id:     mesa.id,
        items:        Object.values(cart),
        notes:        notes,
        status:       'pendiente',
        created_at:   new Date().toISOString(),
        access_token: accessToken
      };

      const { data, error } = await supabase.rpc('create_order', {
        p_id:           order.id,
        p_table_id:     order.table_id,
        p_table_name:   order.table_name,
        p_items:        order.items,
        p_notes:        order.notes,
        p_access_token: order.access_token,
        p_qr_token:     tokenParam
      });

      if(error){
        /* CORRECCIÓN 6: Mensaje de error amigable, sin detalles internos */
        btn.disabled = false;
        btn.textContent = 'Enviar pedido';

        const errDiv = document.querySelector('.error-msg') || (() => {
          const d = document.createElement('div');
          d.className = 'error-msg';
          document.querySelector('.cart-bar').before(d);
          return d;
        })();
        errDiv.textContent = 'No se pudo enviar el pedido. Intentá de nuevo.';
        errDiv.classList.add('visible');
        return;
      }

      localStorage.setItem('order_token_' + order.id, accessToken);
      renderConfirm({ ...order, total: data.total, items: data.items });
    }

    function renderConfirm(order){
      app.innerHTML = `
        <div class="topbar">
          <div class="brand"><span class="display">${esc(RESTAURANT)}</span></div>
        </div>

        <div class="confirm-wrap">
          <div class="ticket confirm-ticket">
            <div class="eyebrow">Pedido enviado — ${esc(order.table_name)}</div>
            <div class="ordid">#${esc(order.id.toUpperCase())}</div>
            <ul>
              ${order.items.map(i => `
                <li>
                  <span>${esc(String(i.qty))}× ${esc(i.name)}</span>
                  <span>${fmt(i.price * i.qty)}</span>
                </li>`).join('')}
            </ul>
            <div style="display:flex;justify-content:space-between;font-weight:700;font-size:14px;">
              <span>Total</span>
              <span>${fmt(order.total)}</span>
            </div>
            <div id="status-pill"></div>
          </div>

          <button class="new-order-btn" id="again-btn">
            + Agregar otro pedido a esta mesa
          </button>
        </div>
      `;

      updateStatusPill(order.status);
      document.getElementById('again-btn').onclick = () => {
        for(const k in cart) delete cart[k];
        draw();
      };
      pollStatus(order.id);
    }

    function updateStatusPill(status){
      const el = document.getElementById('status-pill');
      if(!el) return;
      const label =
        status === 'pendiente'  ? 'Pendiente'     :
        status === 'preparando' ? 'En preparación' :
        status === 'listo'      ? '¡Listo!'        : 'Entregado';

      el.innerHTML = `
        <div class="status-pill status-${esc(status === 'entregado' ? 'listo' : status)}">
          ${esc(label)}
        </div>`;
    }

    async function pollStatus(orderId){
      let ultimoEstado = 'pendiente';
      const estados = { pendiente:0, preparando:1, listo:2, entregado:3 };

      const interval = setInterval(async () => {
        if(!document.getElementById('status-pill')){
          clearInterval(interval);
          return;
        }
        const o = await getOrder(orderId);
        if(!o) return;
        if(estados[o.status] >= estados[ultimoEstado]){
          ultimoEstado = o.status;
          updateStatusPill(o.status);
        }
        if(o.status === 'entregado') clearInterval(interval);
      }, 4000);
    }

    draw();
  }

  async function renderStaff(){
    const { data: { session } } = await supabase.auth.getSession();
    if(!session){
      renderStaffLogin();
      return;
    }

    /* CORRECCIÓN 8: limpiar intervalo anterior antes de crear uno nuevo */
    if(staffInterval) clearInterval(staffInterval);

    app.innerHTML = `
      <div class="topbar">
        <div class="brand"><span class="display">${esc(RESTAURANT)}</span></div>
        <button id="logout-btn" class="admin-link" style="margin-top:0;">← cerrar sesión</button>
      </div>
      <div class="eyebrow">Panel de cocina</div>
      <div class="staff-sub">Los pedidos avanzan de izquierda a derecha. Se actualiza solo cada pocos segundos.</div>
      <div id="board" class="board"></div>
    `;

    document.getElementById('logout-btn').onclick = async () => {
      clearInterval(staffInterval);
      staffInterval = null;
      await supabase.auth.signOut();
      renderStaffLogin();
    };

    async function tick(){
      const { data: { session: s } } = await supabase.auth.getSession();
      if(!s){
        clearInterval(staffInterval);
        staffInterval = null;
        renderStaffLogin();
        return;
      }
      const orders = await getOrders();
      draw(orders);
    }

    function draw(orders){
      const board = document.getElementById('board');
      if(!board) return;

      const cols = [
        { key:'pendiente',  label:'Pendiente',      cls:'col-pendiente',  action:'preparando', actionLabel:'Empezar preparación', actionCls:'action-preparar' },
        { key:'preparando', label:'En Preparación',  cls:'col-preparando', action:'listo',      actionLabel:'Marcar listo',        actionCls:'action-listo'    },
        { key:'listo',      label:'Listo',            cls:'col-listo',      action:'entregado',  actionLabel:'Entregado',           actionCls:'action-entregado' },
      ];

      board.innerHTML = cols.map(col => {
        const list = orders
          .filter(o => o.status === col.key)
          .sort((a,b) => new Date(a.createdAt) - new Date(b.createdAt));

        return `
          <div class="${col.cls}">
            <div class="col-head">
              <span>${col.label}</span>
              <span class="count">${list.length}</span>
            </div>
            ${list.length === 0
              ? '<div class="empty-col">Sin pedidos</div>'
              : list.map(o => `
                  <div class="ticket order-ticket" data-id="${esc(o.id)}">
                    <div class="row1">
                      <span class="mesa">${esc(o.table)}</span>
                      <span class="elapsed">${esc(elapsedLabel(o.createdAt))}</span>
                    </div>
                    <ul>
                      ${o.items.map(i => `
                        <li><span>${esc(String(i.qty))}× ${esc(i.name)}</span></li>
                      `).join('')}
                    </ul>
                    ${o.notes
                      ? `<div class="notes">"${esc(o.notes)}"</div>`
                      : ''}
                    <button class="action ${col.actionCls}" data-next="${col.action}">
                      ${col.actionLabel}
                    </button>
                  </div>`).join('')
            }
          </div>`;
      }).join('');

      board.querySelectorAll('.order-ticket').forEach(card => {
        const btn = card.querySelector('.action');
        btn.onclick = async () => {
          btn.disabled = true;
          const id   = card.dataset.id;
          const next = btn.dataset.next;

          const { error } = await supabase
            .from('orders')
            .update({ status: next })
            .eq('id', id);

          if(error){
            /* CORRECCIÓN 6: error inline en vez de alert() */
            btn.disabled = false;
            btn.textContent = 'Error, reintentá';
            return;
          }
          tick();
        };
      });
    }

    tick();
    /* CORRECCIÓN 8: guardar referencia del intervalo */
    staffInterval = setInterval(tick, 4000);
  }

          <button class="btn-modal btn-secundario" onclick="cerrarModal()">Cancelar</button>

    overlay.style.display = 'flex';

    const btnAbrir = document.getElementById('modal-btn-abrir');
    if(btnAbrir){
      btnAbrir.onclick = async () => {
        btnAbrir.disabled = true;
        btnAbrir.textContent = 'Abriendo…';
        const { error } = await supabase.rpc('open_table_session', { p_table_id: mesaId });
        if(error){
          btnAbrir.disabled = false;
          btnAbrir.textContent = 'Abrir mesa';
          mostrarMensaje('No se pudo abrir la mesa.');
          return;
        }
        await refrescar();
      };
    }

    /* Botón cerrar */
    const btnCerrar = document.getElementById('modal-btn-cerrar');
    if(btnCerrar){
      btnCerrar.onclick = async () => {
        const confirmar = pendientes > 0
          ? confirm(`La mesa tiene ${pendientes} pedido(s) en proceso.\n¿Seguro que deseas cerrarla?`)

        const { error } = await supabase.rpc('close_table_session', { p_table_id: mesaId });
        if(error){
          btnCerrar.disabled = false;
          btnCerrar.textContent = 'Cerrar mesa';
          mostrarMensaje('No se pudo cerrar la mesa.');
          return;
        }
        await refrescar();
      };
    }

  function cerrarModal(){
    modalAbierto = null;

  }

  window.cerrarModal = cerrarModal;

  async function refrescar(){

  function mostrarMensaje(texto){
    const el = document.getElementById('mesero-message');
    if(!el) return;
    el.textContent = texto;
    setTimeout(() => { if(el.textContent === texto) el.textContent = ''; }, 4000);
  }

  await refrescar();

  supabase
    .channel('mesero-mapa')
    .on('postgres_changes', { event:'*', schema:'public', table:'orders' },
      async () => { await refrescar(); })
    .on('postgres_changes', { event:'*', schema:'public', table:'table_sessions' },
      async () => { await refrescar(); })
    .subscribe();
}

  function renderAdministradorLogin(){
    app.innerHTML = `

          style="width:100%;padding:13px;margin-bottom:10px;font-family:inherit;">
        <input id="admin-password" type="password" placeholder="Contraseña"
          style="width:100%;padding:13px;margin-bottom:15px;font-family:inherit;">

        <button id="admin-login-btn" class="send-btn" style="width:100%;">Entrar</button>
        <div id="admin-login-error" style="margin-top:15px;color:#c1502e;font-size:12px;"></div>
      </div>
    `;

    document.getElementById('admin-login-btn').onclick = async () => {
      const email    = document.getElementById('admin-email').value.trim();
      const password = document.getElementById('admin-password').value;
      const errorEl  = document.getElementById('admin-login-error');
      const btn      = document.getElementById('admin-login-btn');

      errorEl.textContent = '';
      btn.disabled = true;
      btn.textContent = 'Entrando…';

      const { error } = await supabase.auth.signInWithPassword({ email, password });

      if(error){
        errorEl.textContent = 'Correo o contraseña incorrectos.';
        btn.disabled = false;
        btn.textContent = 'Entrar';
        return;
      }

      const { data: { user } } = await supabase.auth.getUser();
      const { data: profile, error: profileError } = await supabase
        .from('profiles')
        .select('role')
        .eq('id', user.id)
        .single();

      if(profileError || !profile || !['admin','superadmin'].includes(profile.role)){
        await supabase.auth.signOut();
        errorEl.textContent = 'Esta cuenta no tiene permisos de administrador.';
        btn.disabled = false;
        btn.textContent = 'Entrar';
        return;
      }

      renderAdministrador();
    };
  }

    </div>
  `;

  /* Cargar Tabler Icons si no están */
  if(!document.querySelector('link[href*="tabler-icons"]')){
    const lk = document.createElement('link');
    lk.rel = 'stylesheet';
    lk.href = 'https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css';
    document.head.appendChild(lk);
  }

  /* Fecha en topbar */
  document.getElementById('adash-date').textContent =
    new Date().toLocaleDateString('es-PE',{weekday:'short',day:'numeric',month:'short'});

  /* Logout */
  document.getElementById('adash-logout-btn').onclick = async () => {
    app.style.padding = '';
    app.style.maxWidth = '';
    await supabase.auth.signOut();
    renderAdministradorLogin();
  };

  /* Navegación entre páginas */
  let paginaActual = 'inicio';
  const titulos = { inicio:'Inicio', pedidos:'Pedidos', menu:'Menú', qr:'Códigos QR' };

  document.querySelectorAll('.sb-item[data-adash]').forEach(btn => {
    btn.addEventListener('click', () => {
      const key = btn.dataset.adash;
      document.querySelectorAll('.sb-item').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      document.querySelectorAll('.adash-page').forEach(p => p.classList.remove('active'));
      document.getElementById('adash-'+key).classList.add('active');
      document.getElementById('adash-topbar-title').textContent = titulos[key];
      document.getElementById('adash-add-btn').style.display = key === 'menu' ? 'flex' : 'none';
      paginaActual = key;
      cargarPagina(key);
    });
  });

  /* Tabs de pedidos */
  let filtroActual = 'todos';
  document.querySelectorAll('.adash-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.adash-tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      filtroActual = tab.dataset.filter;
      renderPedidos(filtroActual);
    });
  });

  document.getElementById('adash-refresh-btn').onclick = () => cargarPagina(paginaActual);

  /* ── Carga de datos por página ── */
  async function cargarPagina(key){
    if(key === 'inicio') await cargarInicio();
    if(key === 'pedidos') await cargarPedidos();
    if(key === 'menu') await cargarMenu();
    if(key === 'qr') await cargarQR();
  }

  /* ── INICIO ── */
  async function cargarInicio(){
    const inicioDia = new Date(
      new Date().toLocaleDateString('en-CA',{timeZone:'America/Lima'}) + 'T00:00:00-05:00'
    );

    const [{ data: orders }, { data: sesiones }, { data: menuItems }] = await Promise.all([
      supabase.from('orders').select('id,total,status,created_at,items,table_name').gte('created_at', inicioDia.toISOString()).order('created_at',{ascending:false}),
      supabase.rpc('get_table_sessions'),
      supabase.from('menu_items').select('id,active')
    ]);

    const ords = orders || [];
    const sess = sesiones || [];

    const totalVentas = ords.reduce((s,o) => s + Number(o.total||0), 0);
    const ticketProm  = ords.length > 0 ? totalVentas / ords.length : 0;
    const mesasActivas = MESAS.filter(m => sess.find(s => Number(s.table_id) === m.id && s.status === 'active')).length;

    document.getElementById('ds-orders').textContent = ords.length;
    document.getElementById('ds-sales').textContent  = `S/ ${totalVentas.toFixed(2)}`;
    document.getElementById('ds-mesas').textContent  = `${mesasActivas} / ${MESAS.length}`;
    document.getElementById('ds-avg').textContent    = `S/ ${ticketProm.toFixed(2)}`;

    /* Pedidos activos por mesa */
    const pedidosActivos = ords.filter(o => ['pendiente','preparando','listo'].includes(o.status));

    /* Tiles de mesas */
    const tilesEl = document.getElementById('adash-mesas-tiles');
    tilesEl.innerHTML = MESAS.map(mesa => {
      const sesActiva = sess.find(s => Number(s.table_id) === mesa.id && s.status === 'active');
      const pedMesa   = pedidosActivos.filter(o => {
        const sId = sesActiva?.id;
        return Number(o.table_id||0) === mesa.id && (!sId || o.session_id === sId);
      });
      const pend = pedMesa.filter(o => o.status === 'pendiente' || o.status === 'preparando').length;

      let dotCls = 'mtd-libre', badgeCls = 'mtb-libre', badgeTxt = 'Libre', infoTxt = 'Sin actividad';
      if(sesActiva && pend > 0){ dotCls='mtd-pendiente'; badgeCls='mtb-pendiente'; badgeTxt='Pendiente'; infoTxt=`${pend} pendiente${pend>1?'s':''}`; }
      else if(sesActiva){ dotCls='mtd-activa'; badgeCls='mtb-activa'; badgeTxt='Activa'; infoTxt=`${pedMesa.length} pedido${pedMesa.length!==1?'s':''}`; }

      return `
        <div class="mesa-tile">
          <div class="mt-dot ${dotCls}"></div>
          <div>
            <div class="mt-name">${esc(mesa.nombre)}</div>
            <div class="mt-info">${infoTxt}</div>
          </div>
          <span class="mt-badge ${badgeCls}">${badgeTxt}</span>
        </div>`;
    }).join('');

    /* Pedidos recientes */
    const recEl = document.getElementById('adash-recent-orders');
    const recientes = ords.slice(0, 8);
    if(recientes.length === 0){
      recEl.innerHTML = '<div class="dash-loading">Sin pedidos hoy.</div>';
    } else {
      recEl.innerHTML = recientes.map(o => {
        const hora = new Date(o.created_at).toLocaleTimeString('es-PE',{hour:'2-digit',minute:'2-digit'});
        const items = Array.isArray(o.items) ? o.items.map(i => `${i.name} ×${i.qty}`).join(', ') : '';
        const pillCls = o.status==='preparando'?'op-prep':o.status==='listo'?'op-listo':o.status==='pendiente'?'op-pend':'op-entr';
        const pillTxt = o.status==='preparando'?'Preparando':o.status==='listo'?'Listo':o.status==='pendiente'?'Pendiente':'Entregado';
        return `
          <div class="order-row">
            <span class="or-mesa">${esc(o.table_name||'')}</span>
            <span class="or-time">${hora}</span>
            <span class="or-items">${esc(items)}</span>
            <span class="or-total">S/ ${Number(o.total).toFixed(2)}</span>
            <span class="or-pill ${pillCls}">${pillTxt}</span>
          </div>`;
      }).join('');
    }
  }

  /* ── PEDIDOS ── */
  let todosLosPedidos = [];
  async function cargarPedidos(){
    const { data } = await supabase.from('orders').select('*').order('created_at',{ascending:false}).limit(60);
    todosLosPedidos = (data || []).map(o => ({
      id: o.id, table: o.table_name, tableId: o.table_id,
      items: o.items, total: Number(o.total), notes: o.notes||'',
      status: o.status, createdAt: o.created_at
    }));
    renderPedidos(filtroActual);
  }

  function renderPedidos(filtro){
    const lista = filtro === 'todos'
      ? todosLosPedidos
      : todosLosPedidos.filter(o => o.status === filtro);

    const el = document.getElementById('adash-pedidos-list');
    if(lista.length === 0){ el.innerHTML='<div class="dash-loading">Sin pedidos.</div>'; return; }

    const nextLabel = { pendiente:'Empezar preparación', preparando:'Marcar listo', listo:'Marcar entregado' };

    el.innerHTML = lista.slice(0,20).map(o => {
      const hora = new Date(o.createdAt).toLocaleTimeString('es-PE',{hour:'2-digit',minute:'2-digit'});
      const mins = Math.max(0, Math.floor((Date.now()-new Date(o.createdAt).getTime())/60000));
      const items = Array.isArray(o.items) ? o.items.map(i=>`${esc(i.name)} ×${i.qty}`).join(' · ') : '';
      const pillCls = o.status==='preparando'?'op-prep':o.status==='listo'?'op-listo':o.status==='pendiente'?'op-pend':'op-entr';
      const pillTxt = o.status==='preparando'?'En preparación':o.status==='listo'?'Listo':o.status==='pendiente'?'Pendiente':'Entregado';
      const advBtn  = nextLabel[o.status]
        ? `<button class="pc-btn advance" data-id="${esc(o.id)}" data-next="${o.status==='pendiente'?'preparando':o.status==='preparando'?'listo':'entregado'}">${nextLabel[o.status]}</button>`
        : '';

      return `
        <div class="pedido-card">
          <div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:8px;">
            <div>
              <div class="pc-id">Pedido #${esc(o.id.slice(0,8).toUpperCase())}</div>
              <div class="pc-mesa">${esc(o.table)}</div>
              <div class="pc-time">Hace ${mins} min · ${hora}</div>
            </div>
            <span class="or-pill ${pillCls}">${pillTxt}</span>
          </div>
          <div class="pc-items-text">${items}</div>
          ${o.notes ? `<div style="font-size:11px;color:#9e9890;font-style:italic;margin-bottom:6px;">"${esc(o.notes)}"</div>` : ''}
          <div class="pc-foot">
            <span class="pc-total-val">S/ ${o.total.toFixed(2)}</span>
            <div class="pc-actions">${advBtn}</div>
          </div>
        </div>`;
    }).join('');

    el.querySelectorAll('.advance').forEach(btn => {
      btn.onclick = async () => {
        btn.disabled = true;
        btn.textContent = 'Actualizando…';
        await supabase.from('orders').update({status: btn.dataset.next}).eq('id', btn.dataset.id);
        await cargarPedidos();
      };
    });
  }

  /* ── MENÚ ── */
  async function cargarMenu(){
    const { data } = await supabase.from('menu_items').select('*').order('category').order('id');
    const items = data || [];
    const el = document.getElementById('adash-menu-content');

    if(items.length === 0){ el.innerHTML='<div class="dash-loading">Sin productos.</div>'; return; }

    const porCategoria = {};
    items.forEach(it => {
      if(!porCategoria[it.category]) porCategoria[it.category] = [];
      porCategoria[it.category].push(it);
    });

    el.innerHTML = Object.entries(porCategoria).map(([cat, prods]) => `
      <div class="cat-sep">
        <span class="cat-sep-label">${esc(cat)}</span>
        <div class="cat-sep-line"></div>
      </div>
      <div class="menu-grid-dash">
        ${prods.map(p => `
          <div class="menu-card-dash">
            <div class="mc-img"><i class="ti ti-bowl" aria-hidden="true"></i></div>
            <div class="mc-body">
              <div class="mc-cat-label">${esc(p.category)}</div>
              <div class="mc-name">${esc(p.name)}</div>
              <div class="mc-desc">${esc(p.description||'')}</div>
              <div class="mc-row">
                <span class="mc-price">S/ ${Number(p.price).toFixed(2)}</span>
                ${p.active
                  ? `<span class="mc-on"><span class="mc-on-dot"></span> Disponible</span>`
                  : `<span class="mc-off"><span class="mc-off-dot"></span> No disponible</span>`}
              </div>
            </div>
            <div class="mc-actions">
              <button class="mc-action-btn">Editar</button>
              <button class="mc-action-btn del" data-id="${p.id}">Eliminar</button>
            </div>
          </div>`).join('')}
      </div>`).join('');
  }

  /* ── QR ── */
  async function cargarQR(){
    const tokens = await getTableTokens();
    const el = document.getElementById('adash-qr-grid');

    el.innerHTML = MESAS.map(m => {
      const td = tokens.find(t => t.table_id === m.id);
      if(!td) return `
        <div class="qr-card-dash">
          <div class="qr-card-name">${esc(m.nombre)}</div>
          <div class="qr-img-wrap" style="color:#c8c5c0;font-size:12px;">Sin token</div>
        </div>`;

      const url = new URL(baseUrl);
      url.search = '';
      url.searchParams.set('token', td.token);
      const qrSrc = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&margin=6&data=${encodeURIComponent(url.toString())}`;

      return `
        <div class="qr-card-dash">
          <div class="qr-card-name">${esc(m.nombre)}</div>
          <div class="qr-img-wrap">
            <img src="${qrSrc}" width="100" height="100" alt="QR ${esc(m.nombre)}" style="display:block;">
          </div>
          <a href="${qrSrc.replace('200x200','400x400')}" download="QR-${esc(m.nombre)}.png" target="_blank">
            <button class="qr-dl-btn">↓ Descargar</button>
          </a>
        </div>`;
    }).join('');
  }

  /* Carga inicial */
  await cargarInicio();
}

  /* ============================================================
     ROUTER
  ============================================================ */
  if(isAdmin){
    /* CORRECCIÓN 7: panel de cocina ahora pasa por login */
    const { data: { session } } = await supabase.auth.getSession();
    if(!session){
      renderStaffLogin();
    } else {
      renderStaff();
    }
  }
    else if(isMesero){
  const { data: { session } } = await supabase.auth.getSession();

  if(!session){
    renderMeseroLogin();
  } else {
    renderMesero();
  }
}
  else if(isAdministrador){
    const { data: { session } } = await supabase.auth.getSession();
    if(!session){
      renderAdministradorLogin();
    } else {
      const { data: { user } } = await supabase.auth.getUser();
      const { data: profile }  = await supabase
        .from('profiles').select('role').eq('id', user.id).single();

      if(profile && ['admin','superadmin'].includes(profile.role)){
        renderAdministrador();
      } else {
        await supabase.auth.signOut();
        renderAdministradorLogin();
      }
    }
  }
else if(tokenParam){

  const resultado = await getTableByToken(tokenParam);

  if(!resultado.valid){

    if(resultado.reason === 'mesa_inactiva'){

      app.innerHTML = `
        <div style="text-align:center;padding:60px 20px;">

          <div class="eyebrow">
            Mesa no disponible
          </div>

          <div
            class="display"
            style="font-size:32px;margin:10px 0;">
            Mesa cerrada
          </div>

          <p style="color:var(--paper-shadow);">
            Esta mesa todavía no ha sido habilitada
            para realizar pedidos.
          </p>

        </div>
      `;

    } else {

      app.innerHTML = `
        <div style="text-align:center;padding:60px 20px;">

          <div class="eyebrow">
            QR no válido
          </div>

          <div
            class="display"
            style="font-size:32px;margin:10px 0;">
            Código no reconocido
          </div>

          <p style="color:var(--paper-shadow);">
            Este código QR no corresponde a una
            mesa válida.
          </p>

        </div>
      `;

    }

    return;
  }

  const mesa = resultado.mesa;

  bloquearNavegacionMesa(tokenParam);

  renderCustomer(mesa.id);
}
  else{
    renderHome();
  }

})();
</script>
</body>
</html>
