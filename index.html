<!DOCTYPE html>
<html lang="es">
<head>
  <style id="sa-professional-ui-upgrade">

/* ============================================================
   SUPERADMIN — UI/UX PROFESSIONAL UPGRADE
   ============================================================ */

#sa-layout{
  --sa-bg:#f6f5f2;
  --sa-surface:#ffffff;
  --sa-surface-soft:#faf9f7;
  --sa-border:#e7e4de;
  --sa-border-strong:#d9d5ce;
  --sa-text:#181715;
  --sa-text-2:#5f5a53;
  --sa-text-3:#918b83;
  --sa-accent:#1d1c1a;
  --sa-rust:#a9472f;
  --sa-green:#557258;
  --sa-gold:#a57c22;

  display:flex;
  min-height:100vh;
  background:var(--sa-bg);
  color:var(--sa-text);

  font-family:
    Inter,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  letter-spacing:-.01em;
}


/* ============================================================
   SIDEBAR
   ============================================================ */

#sa-sidebar{
  width:248px;
  min-width:248px;

  display:flex;
  flex-direction:column;

  background:#1b1a18;
  color:#fff;

  border-right:1px solid #292825;

  position:sticky;
  top:0;
  height:100vh;

  box-sizing:border-box;

  z-index:20;
}


.sa-brand{
  height:82px;
  padding:0 22px;

  display:flex;
  align-items:center;

  border-bottom:1px solid rgba(255,255,255,.07);

  box-sizing:border-box;
}


.sa-brand-logo{
  width:100%;

  display:flex;
  align-items:center;
  gap:12px;
}


.sa-brand-mark{
  width:38px;
  height:38px;

  flex-shrink:0;

  display:flex;
  align-items:center;
  justify-content:center;

  border:1px solid rgba(255,255,255,.14);
  border-radius:9px;

  background:#292724;
  color:#fff;

  font-family:Archivo,sans-serif;
  font-size:12px;
  font-weight:900;

  letter-spacing:-.04em;

  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.05);
}


.sa-brand-text{
  min-width:0;
}


.sa-brand-name{
  color:#fff;

  font-family:Archivo,sans-serif;
  font-size:14px;
  font-weight:800;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;

  line-height:1.2;
}


.sa-brand-sub{
  margin-top:4px;

  color:#858079;

  font-size:10px;
  font-weight:500;

  letter-spacing:.02em;
}


/* ============================================================
   NAVIGATION
   ============================================================ */

.sa-nav{
  flex:1;

  padding:22px 12px;

  overflow-y:auto;
}


.sa-nav-section{
  padding:0 10px 8px;

  color:#68635c;

  font-size:9px;
  font-weight:800;

  text-transform:uppercase;
  letter-spacing:.13em;
}


.sa-nav-divider{
  height:1px;

  margin:17px 8px;

  background:rgba(255,255,255,.07);
}


.sa-nav-item{
  width:100%;

  min-height:42px;

  display:flex;
  align-items:center;
  gap:11px;

  margin:2px 0;
  padding:0 11px;

  border:1px solid transparent;
  border-radius:8px;

  background:transparent;

  color:#9b958d;

  font-family:inherit;
  font-size:12px;
  font-weight:550;

  cursor:pointer;
  text-align:left;

  transition:
    background .16s ease,
    color .16s ease,
    border-color .16s ease,
    transform .12s ease;
}


.sa-nav-item i{
  width:18px;

  display:flex;
  align-items:center;
  justify-content:center;

  color:#78736c;

  font-size:17px;

  transition:color .16s ease;
}


.sa-nav-item:hover{
  background:#252421;
  color:#e9e6e1;
}


.sa-nav-item:hover i{
  color:#c5c0b9;
}


.sa-nav-item.active{
  background:#302e2a;

  border-color:#3b3935;

  color:#fff;

  box-shadow:
    inset 2px 0 0 #fff;
}


.sa-nav-item.active i{
  color:#fff;
}


/* ============================================================
   SIDEBAR FOOTER
   ============================================================ */

.sa-sidebar-footer{
  margin:0 12px 14px;
  padding:13px 10px;

  display:flex;
  align-items:center;
  gap:10px;

  border-top:1px solid rgba(255,255,255,.07);
}


.sa-sidebar-avatar{
  width:32px;
  height:32px;

  flex-shrink:0;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:8px;

  background:#302e2a;

  border:1px solid rgba(255,255,255,.08);

  color:#fff;

  font-family:Archivo,sans-serif;
  font-size:10px;
  font-weight:800;
}


.sa-sidebar-uname{
  color:#e8e4df;

  font-size:11px;
  font-weight:650;
}


.sa-sidebar-urole{
  margin-top:3px;

  color:#77726b;

  font-size:9px;
}


/* ============================================================
   MAIN
   ============================================================ */

#sa-main{
  min-width:0;
  flex:1;

  background:var(--sa-bg);
}


/* ============================================================
   TOPBAR
   ============================================================ */

#sa-topbar{
  height:68px;

  padding:0 30px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  background:rgba(255,255,255,.92);

  border-bottom:1px solid var(--sa-border);

  box-sizing:border-box;

  position:sticky;
  top:0;

  z-index:15;

  backdrop-filter:blur(12px);
}


.sa-topbar-title{
  color:var(--sa-text);

  font-family:Archivo,sans-serif;

  font-size:14px;
  font-weight:800;

  letter-spacing:-.015em;
}


.sa-topbar-right{
  display:flex;
  align-items:center;
  gap:10px;
}


.sa-topbar-date{
  margin-right:7px;

  color:var(--sa-text-3);

  font-size:10px;
  font-weight:550;
}


/* ============================================================
   TOPBAR BUTTONS
   ============================================================ */

.sa-tbtn{
  height:35px;

  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:7px;

  padding:0 12px;

  border:1px solid var(--sa-border-strong);
  border-radius:7px;

  background:#fff;

  color:var(--sa-text-2);

  font-family:inherit;

  font-size:11px;
  font-weight:650;

  cursor:pointer;

  transition:
    background .15s ease,
    border-color .15s ease,
    color .15s ease,
    transform .1s ease;
}


.sa-tbtn:hover{
  background:#f7f6f3;
  border-color:#cfcac2;
  color:var(--sa-text);
}


.sa-tbtn:active{
  transform:translateY(1px);
}


.sa-tbtn.primary{
  background:#1d1c1a;
  border-color:#1d1c1a;

  color:#fff;
}


.sa-tbtn.primary:hover{
  background:#302e2b;
  border-color:#302e2b;
}


/* ============================================================
   CONTENT
   ============================================================ */

#sa-content{
  max-width:1440px;

  margin:0 auto;

  padding:30px;

  box-sizing:border-box;
}


.sa-page{
  animation:sa-page-in .18s ease;
}


@keyframes sa-page-in{

  from{
    opacity:0;
    transform:translateY(3px);
  }

  to{
    opacity:1;
    transform:translateY(0);
  }

}


/* ============================================================
   PAGE HEADER
   ============================================================ */

.sa-ph{
  margin-bottom:25px;

  display:flex;
  align-items:flex-end;
  justify-content:space-between;
}


.sa-ph-title{
  color:var(--sa-text);

  font-family:Archivo,sans-serif;

  font-size:26px;
  font-weight:850;

  line-height:1.1;

  letter-spacing:-.035em;
}


.sa-ph-sub{
  margin-top:7px;

  color:var(--sa-text-3);

  font-size:11px;
  font-weight:500;
}


/* ============================================================
   STAT CARDS
   ============================================================ */

.sa-stats{
  display:grid;

  grid-template-columns:
    repeat(3,minmax(0,1fr));

  gap:12px;

  margin-bottom:18px;
}


.sa-stat{
  min-height:132px;

  position:relative;

  padding:19px;

  overflow:hidden;

  border:1px solid var(--sa-border);
  border-radius:10px;

  background:var(--sa-surface);

  box-sizing:border-box;

  box-shadow:
    0 1px 2px rgba(28,26,23,.025);

  transition:
    border-color .15s ease,
    box-shadow .15s ease,
    transform .15s ease;
}


.sa-stat:hover{
  border-color:#d8d4cd;

  box-shadow:
    0 8px 24px rgba(28,26,23,.055);

  transform:translateY(-1px);
}


.sa-stat-accent{
  position:absolute;

  left:0;
  top:0;
  bottom:0;

  width:3px;
}


.sa-stat-icon{
  width:34px;
  height:34px;

  margin-bottom:15px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:8px;

  font-size:16px;
}


.sa-stat-label{
  color:var(--sa-text-3);

  font-size:10px;
  font-weight:650;

  text-transform:uppercase;

  letter-spacing:.055em;
}


.sa-stat-val{
  margin-top:5px;

  color:var(--sa-text);

  font-family:Archivo,sans-serif;

  font-size:24px;
  font-weight:850;

  line-height:1.1;

  letter-spacing:-.035em;
}


/* ============================================================
   CARDS
   ============================================================ */

.sa-card{
  border:1px solid var(--sa-border);

  border-radius:10px;

  background:#fff;

  box-shadow:
    0 1px 2px rgba(28,26,23,.025);

  overflow:hidden;
}


.sa-card-head{
  min-height:68px;

  padding:17px 20px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  border-bottom:1px solid var(--sa-border);

  box-sizing:border-box;
}


.sa-card-title{
  color:var(--sa-text);

  font-family:Archivo,sans-serif;

  font-size:13px;
  font-weight:800;
}


.sa-card-sub{
  margin-top:4px;

  color:var(--sa-text-3);

  font-size:10px;

  line-height:1.4;
}


.sa-card-body{
  padding:20px;
}


/* ============================================================
   ACCESS PANELS
   ============================================================ */

.sa-acceso-grid{
  display:grid;

  grid-template-columns:
    repeat(3,minmax(0,1fr));

  gap:13px;
}


.sa-acceso-card{
  position:relative;

  padding:20px;

  border:1px solid var(--sa-border);

  border-radius:9px;

  background:#fff;

  box-sizing:border-box;

  transition:
    border-color .16s ease,
    box-shadow .16s ease,
    transform .16s ease;
}


.sa-acceso-card:hover{
  border-color:#d5d1c9;

  box-shadow:
    0 10px 25px rgba(28,26,23,.055);

  transform:translateY(-2px);
}


.sa-acceso-icon{
  width:38px;
  height:38px;

  margin-bottom:17px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:9px;

  font-size:18px;
}


.sa-acceso-title{
  color:var(--sa-text);

  font-family:Archivo,sans-serif;

  font-size:14px;
  font-weight:800;

  letter-spacing:-.015em;
}


.sa-acceso-desc{
  min-height:40px;

  margin-top:7px;

  color:#777169;

  font-size:11px;

  line-height:1.55;
}


.sa-acceso-btn{
  width:100%;

  height:36px;

  margin-top:17px;

  display:flex;
  align-items:center;
  justify-content:center;

  gap:7px;

  border-radius:7px;

  font-family:inherit;

  font-size:10.5px;
  font-weight:700;

  cursor:pointer;

  transition:
    background .15s ease,
    transform .1s ease;
}


.sa-acceso-btn:hover{
  transform:translateY(-1px);
}


.sa-btn-rust{
  border:1px solid #a9472f;

  background:#a9472f;

  color:#fff;
}


.sa-btn-rust:hover{
  background:#933d29;
}


.sa-btn-mustard{
  border:1px solid #a57c22;

  background:#a57c22;

  color:#fff;
}


.sa-btn-mustard:hover{
  background:#8f6b1d;
}


.sa-btn-sage{
  border:1px solid #557258;

  background:#557258;

  color:#fff;
}


.sa-btn-sage:hover{
  background:#49624c;
}


/* ============================================================
   TABLES
   ============================================================ */

.sa-table-wrap{
  width:100%;

  overflow-x:auto;

  border:1px solid var(--sa-border);

  border-radius:8px;

  background:#fff;
}


.sa-table,
.sa-perms-table{
  width:100%;

  border-collapse:collapse;

  font-size:11px;
}


.sa-table{
  min-width:650px;
}


.sa-table thead,
.sa-perms-table thead{
  background:#faf9f7;
}


.sa-table th,
.sa-perms-table th{
  padding:11px 14px;

  border-bottom:1px solid var(--sa-border);

  color:#777169;

  font-size:9px;
  font-weight:800;

  text-transform:uppercase;

  letter-spacing:.07em;

  text-align:left;
}


.sa-table td,
.sa-perms-table td{
  padding:13px 14px;

  border-bottom:1px solid #efede9;

  color:#403c37;

  vertical-align:middle;
}


.sa-table tbody tr:last-child td,
.sa-perms-table tbody tr:last-child td{
  border-bottom:none;
}


.sa-table tbody tr{
  transition:background .12s ease;
}


.sa-table tbody tr:hover{
  background:#fcfbfa;
}


.sa-td-name{
  color:#25231f;

  font-size:11px;
  font-weight:700;
}


.sa-td-id{
  margin-top:3px;

  color:#aaa49c;

  font-family:"JetBrains Mono",monospace;

  font-size:9px;
}


.sa-role-pill{
  display:inline-flex;
  align-items:center;

  min-height:24px;

  padding:0 8px;

  border-radius:5px;

  font-size:9px;
  font-weight:750;
}


.srp-superadmin{
  background:#eee;
  color:#25231f;
}


.srp-admin{
  background:#fdf1ed;
  color:#a9472f;
}


.srp-mozo{
  background:#edf4ec;
  color:#557258;
}


.srp-cocina{
  background:#fdf8ec;
  color:#96701d;
}


.sa-td-actions{
  display:flex;
  align-items:center;
  gap:7px;
}


.sa-action-sel{
  height:32px;

  padding:0 28px 0 9px;

  border:1px solid #ddd9d2;

  border-radius:6px;

  background:#fff;

  color:#4e4943;

  font-family:inherit;

  font-size:10px;

  outline:none;

  cursor:pointer;
}


.sa-action-sel:focus{
  border-color:#a8a29a;

  box-shadow:
    0 0 0 3px rgba(28,26,23,.045);
}


.sa-action-btn{
  height:32px;

  padding:0 11px;

  border:1px solid #1d1c1a;

  border-radius:6px;

  background:#1d1c1a;

  color:#fff;

  font-family:inherit;

  font-size:10px;
  font-weight:700;

  cursor:pointer;
}


.sa-action-btn:hover{
  background:#302e2b;
}


/* ============================================================
   PERMISSIONS
   ============================================================ */

.sa-perms-table th:not(:first-child),
.sa-perms-table td:not(:first-child){
  text-align:center;
}


.sa-perms-table td:first-child{
  color:#34312d;
  font-weight:600;
}


.sa-check{
  width:22px;
  height:22px;

  margin:auto;

  display:inline-flex;
  align-items:center;
  justify-content:center;

  border-radius:50%;

  background:#edf4ec;

  color:#557258;

  font-size:11px;
  font-weight:900;
}


.sa-dash{
  color:#c2bdb5;

  font-weight:600;
}


/* ============================================================
   ACTIVITY
   ============================================================ */

.sa-activity-list{
  border:1px solid var(--sa-border);

  border-radius:8px;

  overflow:hidden;
}


.sa-activity-item{
  min-height:65px;

  padding:14px 16px;

  display:flex;
  align-items:flex-start;

  gap:11px;

  border-bottom:1px solid #efede9;

  box-sizing:border-box;

  background:#fff;
}


.sa-activity-item:last-child{
  border-bottom:none;
}


.sa-activity-item:hover{
  background:#fcfbfa;
}


.sa-activity-dot{
  width:7px;
  height:7px;

  margin-top:5px;

  border-radius:50%;

  flex-shrink:0;

  box-shadow:
    0 0 0 3px rgba(0,0,0,.025);
}


.sa-activity-text{
  color:#3b3833;

  font-size:11px;

  line-height:1.5;
}


.sa-activity-text strong{
  color:#1d1c1a;

  font-weight:800;
}


.sa-activity-time{
  margin-top:3px;

  color:#aaa49c;

  font-size:9px;
}


/* ============================================================
   LOADING / EMPTY
   ============================================================ */

.sa-loading{
  padding:50px 20px;

  text-align:center;

  color:#99938b;

  font-size:11px;
}


.sa-empty{
  padding:45px 20px;

  text-align:center;

  color:#aaa49c;

  font-size:11px;
}


/* ============================================================
   MODAL
   ============================================================ */

.sa-overlay{
  background:rgba(18,17,15,.52);

  backdrop-filter:blur(5px);
}


.sa-modal{
  width:min(450px,calc(100vw - 30px));

  border:1px solid rgba(255,255,255,.5);

  border-radius:12px;

  box-shadow:
    0 30px 80px rgba(0,0,0,.20);

  animation:sa-modal-professional .18s ease;
}


@keyframes sa-modal-professional{

  from{
    opacity:0;
    transform:translateY(8px) scale(.985);
  }

  to{
    opacity:1;
    transform:translateY(0) scale(1);
  }

}


.sa-modal-head{
  padding:18px 21px;

  background:#fcfbfa;

  border-bottom:1px solid var(--sa-border);
}


.sa-modal-title{
  font-size:14px;
}


.sa-modal-close{
  width:28px;
  height:28px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:6px;

  transition:
    background .15s ease,
    color .15s ease;
}


.sa-modal-close:hover{
  background:#efede9;
}


.sa-modal-body{
  padding:21px;
}


.sa-label{
  color:#625d56;

  font-size:10px;
  font-weight:700;

  text-transform:uppercase;

  letter-spacing:.045em;
}


.sa-input,
.sa-select{
  min-height:40px;

  border-color:#ddd9d2;

  border-radius:7px;

  font-family:Inter,sans-serif;

  font-size:12px;

  transition:
    border-color .15s ease,
    box-shadow .15s ease;
}


.sa-input:focus,
.sa-select:focus{
  border-color:#8c857d;

  box-shadow:
    0 0 0 3px rgba(28,26,23,.045);
}


.sa-modal-foot{
  padding:0 21px 20px;
}


/* ============================================================
   ACCESS DENIED / SYSTEM STATES
   ============================================================ */

.access-state{
  background:#f6f5f2;
}


.access-state-icon{
  width:52px;
  height:52px;

  border-radius:11px;

  box-shadow:
    0 4px 15px rgba(28,26,23,.035);
}


.access-state .display{
  font-size:27px;
}


/* ============================================================
   RESPONSIVE — TABLET
   ============================================================ */

@media(max-width:1050px){

  #sa-sidebar{
    width:68px;
    min-width:68px;
  }


  .sa-brand{
    padding:0;

    justify-content:center;
  }


  .sa-brand-text,
  .sa-nav-section,
  .sa-nav-item span,
  .sa-sidebar-uname,
  .sa-sidebar-urole{
    display:none;
  }


  .sa-nav-item{
    justify-content:center;

    padding:0;

    min-height:42px;
  }


  .sa-nav-item i{
    width:auto;
  }


  .sa-sidebar-footer{
    justify-content:center;

    margin-left:8px;
    margin-right:8px;
  }


  .sa-stats{
    grid-template-columns:
      repeat(2,minmax(0,1fr));
  }


  .sa-acceso-grid{
    grid-template-columns:
      repeat(2,minmax(0,1fr));
  }

}


/* ============================================================
   RESPONSIVE — MOBILE
   ============================================================ */

@media(max-width:700px){

  #sa-topbar{
    height:60px;

    padding:0 16px;
  }


  .sa-topbar-date{
    display:none;
  }


  .sa-topbar-title{
    font-size:13px;
  }


  .sa-tbtn{
    height:33px;

    padding:0 9px;

    font-size:10px;
  }


  .sa-tbtn:not(.primary) span{
    display:none;
  }


  #sa-content{
    padding:20px 14px;
  }


  .sa-ph{
    margin-bottom:19px;
  }


  .sa-ph-title{
    font-size:22px;
  }


  .sa-ph-sub{
    font-size:10px;
  }


  .sa-stats{
    grid-template-columns:1fr;

    gap:9px;
  }


  .sa-stat{
    min-height:112px;

    padding:16px;
  }


  .sa-stat-icon{
    margin-bottom:11px;
  }


  .sa-stat-val{
    font-size:21px;
  }


  .sa-acceso-grid{
    grid-template-columns:1fr;
  }


  .sa-card-body{
    padding:14px;
  }


  .sa-card-head{
    padding:15px;
  }


  .sa-card-title{
    font-size:12px;
  }


  .sa-table{
    min-width:620px;
  }


  .sa-perms-table{
    min-width:620px;
  }

<script>
(async function(){

  const RESTAURANT  = "RAIL";
  const SUPABASE_URL = "https://ubvxxamgguqgyayzgdxi.supabase.co";
  const SUPABASE_KEY = "sb_publishable_a9bjE0XB_Q42trAFqZ172Q_XyZcYt1V";

  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  window.appSupabase = supabase;

  const MESAS = [
    {id:1, nombre:"Mesa 1"},
    {id:2, nombre:"Mesa 2"},
    {id:3, nombre:"Mesa 3"},
    {id:4, nombre:"Mesa 4"},
  ];

  const app    = document.getElementById('app');
  const params = new URLSearchParams(window.location.search);

  const tokenParam    = params.get('token');
  const isAdmin       = params.get('admin') === '1';
  const isAdministrador = params.get('administrador') === '1';
  const isMesero       = params.get('mesero') === '1';
  const baseUrl       = window.location.origin + window.location.pathname;

  // ── Referencia al intervalo de cocina para poder limpiarlo ──
  let staffInterval = null;

  /* ============================================================
     CORRECCIÓN 1: Sanitización contra XSS
     Escapa caracteres HTML antes de insertar texto en el DOM.
  ============================================================ */
  function esc(str){
    return String(str ?? '')
      .replace(/&/g,'&amp;')
      .replace(/</g,'&lt;')
      .replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;')
      .replace(/'/g,'&#39;');
  }

  function fmt(n){
    return 'S/ ' + Number(n).toFixed(2);
  }

  function qrUrl(targetUrl){
    return 'https://api.qrserver.com/v1/create-qr-code/?size=220x220&margin=8&data='
      + encodeURIComponent(targetUrl);
  }

  function elapsedLabel(iso){
    const s = Math.max(0, Math.floor((Date.now() - new Date(iso).getTime()) / 1000));
    const m = Math.floor(s / 60);
    const r = s % 60;
    return m + ':' + String(r).padStart(2,'0');
  }


  /* ============================================================
     CORRECCIÓN 2: getTableByToken usa la RPC validate_qr_token
     en vez de consultar table_qr_tokens directamente.
  ============================================================ */
 async function getTableByToken(token){
  const cleanToken = String(token || '').trim();

  const { data, error } = await supabase.rpc('validate_qr_token', {
    p_token: cleanToken
  });

  if(error || !data){
    return {
      valid: false,
      reason: 'error'
    };
  }

  if(!data.valid){
    return {
      valid: false,
      reason: data.reason || 'qr_invalido'
    };
  }

  const tableId = Number(data.table_id);

  const mesa = MESAS.find(
    m => Number(m.id) === tableId
  );

  if(!mesa){
    return {
      valid: false,
      reason: 'qr_invalido'
    };
  }

  return {
    valid: true,
    mesa
  };
}

  /* ============================================================
     CORRECCIÓN 3: getTableTokens usa la RPC get_table_qr_codes
     en vez de consultar table_qr_tokens directamente.
  ============================================================ */
  async function getTableTokens(){
    const { data, error } = await supabase.rpc('get_table_qr_codes');

    if(error){
      // Solo loguear en desarrollo, nunca mostrar al usuario
      if(location.hostname === 'localhost' || location.hostname === '127.0.0.1'){
        console.error('Error leyendo tokens:', error);
      }
      return [];
    }

    return data || [];
  }

  async function getMenu(){
    const { data, error } = await supabase
      .from('menu_items')
      .select('id, name, category, price')
      .eq('active', true)
      .order('id');

    if(error) return [];

    const categories = {};
    data.forEach(item => {
      if(!categories[item.category]) categories[item.category] = [];
      categories[item.category].push({
        id: item.id,
        name: item.name,
        price: Number(item.price)
      });
    });

    return Object.entries(categories).map(([cat, items]) => ({ cat, items }));
  }

  async function getOrders(){
    const { data, error } = await supabase
      .from('orders')
      .select('*')
      .order('created_at', { ascending: true });

    if(error) return [];

    return data.map(o => ({
      id:        o.id,
      table:     o.table_name,
      tableId:   o.table_id,
      items:     o.items,
      total:     Number(o.total),
      notes:     o.notes || '',
      status:    o.status,
      createdAt: o.created_at
    }));
  }

  async function getOrder(orderId){
    const token = localStorage.getItem('order_token_' + orderId);
    if(!token) return null;

    const { data, error } = await supabase.rpc('get_order_by_token', {
      p_order_id:    orderId,
      p_access_token: token
    });

    if(error || !data || data.length === 0) return null;

    const o = data[0];
    return {
      id:        o.id,
      table:     o.table_name,
      tableId:   o.table_id,
      items:     o.items,
      total:     Number(o.total),
      notes:     o.notes || '',
      status:    o.status,
      createdAt: o.created_at
    };
  }


  /* ============================================================
     CORRECCIÓN 4: Bloqueo de navegación del cliente
  ============================================================ */
  function bloquearNavegacionMesa(token){
    const urlMesa = baseUrl + '?token=' + encodeURIComponent(token);
    history.replaceState(null, '', urlMesa);
    history.pushState(null, '', urlMesa);
    window.addEventListener('popstate', function(){
      history.pushState(null, '', urlMesa);
    });
  }


  /* ============================================================
     HOME
  ============================================================ */
  async function renderHome(){
    const tokens = await getTableTokens();

    app.innerHTML = `
      <div class="topbar">
        <div class="brand">
          <span class="display">${esc(RESTAURANT)}</span>
        </div>
      </div>

      <div class="hero">
        <div class="eyebrow">Pedidos por QR</div>
        <div class="display">Escanea, pide,<br>llega a cocina.</div>
        <p>Cada mesa tiene su propio código QR. El cliente escanea, arma su pedido desde el menú y este aparece al instante en el panel de cocina.</p>
      </div>

      <div class="table-grid">
        ${MESAS.map(m => {
          const tokenData = tokens.find(t => t.table_id === m.id);
          if(!tokenData){
            return `
              <div class="ticket table-card">
                <div class="num">Mesa N.º ${m.id}</div>
                <div class="name">${esc(m.nombre)}</div>
                <div style="color:var(--rust);font-size:11px;">Sin token</div>
              </div>`;
          }
          const url = new URL(baseUrl);
          url.search = '';
          url.searchParams.set('token', tokenData.token);
          return `
            <div class="ticket table-card">
              <div class="num">Mesa N.º ${m.id}</div>
              <div class="name">${esc(m.nombre)}</div>
              <img src="${qrUrl(url.toString())}" alt="QR ${esc(m.nombre)}">
            </div>`;
        }).join('')}
      </div>

<a class="admin-link" href="${baseUrl}?admin=1">→ Abrir panel de cocina</a>

<a class="admin-link" href="${baseUrl}?mesero=1">→ Abrir panel de mesero</a>

<a class="admin-link" href="${baseUrl}?administrador=1">→ Abrir panel administrativo</a>

      <div class="note-box">
        Los QR codifican la URL actual de esta página.
        Para que funcionen al escanearlos con un celular real,
        comparte/publica este artefacto primero.
      </div>
    `;
  }


  /* ============================================================
     CUSTOMER
  ============================================================ */
  async function renderCustomer(mesaId){
    const mesa = MESAS.find(m => m.id === mesaId) || { id: mesaId, nombre: 'Mesa ' + mesaId };
    const menu = await getMenu();
    const cart = {};

    function cartTotal(){
      return Object.values(cart).reduce((s,i) => s + i.price * i.qty, 0);
    }
    function cartCount(){
      return Object.values(cart).reduce((s,i) => s + i.qty, 0);
    }

    function draw(){
      app.innerHTML = `
        <div class="topbar">
          <div class="brand"><span class="display">${esc(RESTAURANT)}</span></div>
        </div>

        <div class="mesa-title">
          <div>
            <div class="eyebrow">Estás pidiendo desde</div>
            <div class="display">${esc(mesa.nombre)}</div>
          </div>
        </div>

        <div id="menu-wrap"></div>

        <textarea id="notes" class="notes-field"
          placeholder="Notas para cocina (opcional): sin cebolla, poco picante, etc."
          maxlength="300"
        ></textarea>

        <div style="height:90px;"></div>

        <div class="cart-bar">
          <div class="total">
            <span>${cartCount()} ítem(s)</span>
            ${fmt(cartTotal())}
          </div>
          <button class="send-btn" id="send-btn" ${cartCount()===0?'disabled':''}>
            Enviar pedido
          </button>
        </div>
      `;

      const wrap = document.getElementById('menu-wrap');

      /* CORRECCIÓN 1 aplicada: esc() en todos los textos del menú */
      wrap.innerHTML = menu.map(cat => `
        <div class="cat-block">
          <h3>${esc(cat.cat)}</h3>
          ${cat.items.map(it => {
            const qty = cart[it.name]?.qty || 0;
            return `
              <div class="item-row" data-name="${esc(it.name)}">
                <div class="meta">
                  <div class="name">${esc(it.name)}</div>
                  <div class="price">${fmt(it.price)}</div>
                </div>
                <div class="stepper">
                  <button class="dec" ${qty===0?'disabled':''}>−</button>
                  <span class="qty">${qty}</span>
                  <button class="inc">+</button>
                </div>
              </div>`;
          }).join('')}
        </div>`).join('');

      wrap.querySelectorAll('.item-row').forEach(row => {
        const name = row.dataset.name;
        const item = menu.flatMap(c => c.items).find(i => i.name === name);

        row.querySelector('.inc').onclick = () => {
          if(!cart[name]){
            cart[name] = { menuItemId: item.id, name: item.name, price: item.price, qty: 0 };
          }
          cart[name].qty++;
          draw();
        };

        row.querySelector('.dec').onclick = () => {
          if(!cart[name]) return;
          cart[name].qty--;
          if(cart[name].qty <= 0) delete cart[name];
          draw();
        };
      });

      document.getElementById('send-btn').onclick = sendOrder;
    }

    async function sendOrder(){
      const btn = document.getElementById('send-btn');
      btn.disabled = true;
      btn.textContent = 'Enviando…';

      /* CORRECCIÓN 1 aplicada: notas tienen maxlength en HTML
         y se truncan por seguridad también en JS              */
      const notes = (document.getElementById('notes').value || '').trim().slice(0, 300);

      const accessToken = crypto.randomUUID();

      /* CORRECCIÓN 5: ID generado con randomUUID en vez de
         Date.now() + Math.random()                          */
      const orderId = crypto.randomUUID();

      const order = {
        id:           orderId,
        table_name:   mesa.nombre,
        table_id:     mesa.id,
        items:        Object.values(cart),
        notes:        notes,
        status:       'pendiente',
        created_at:   new Date().toISOString(),
        access_token: accessToken
      };

      const { data, error } = await supabase.rpc('create_order', {
        p_id:           order.id,
        p_table_id:     order.table_id,
        p_table_name:   order.table_name,
        p_items:        order.items,
        p_notes:        order.notes,
        p_access_token: order.access_token,
        p_qr_token:     tokenParam
      });

      if(error){
        /* CORRECCIÓN 6: Mensaje de error amigable, sin detalles internos */
        btn.disabled = false;
        btn.textContent = 'Enviar pedido';

        const errDiv = document.querySelector('.error-msg') || (() => {
          const d = document.createElement('div');
          d.className = 'error-msg';
          document.querySelector('.cart-bar').before(d);
          return d;
        })();
        errDiv.textContent = 'No se pudo enviar el pedido. Intentá de nuevo.';
        errDiv.classList.add('visible');
        return;
      }

      localStorage.setItem('order_token_' + order.id, accessToken);
      renderConfirm({ ...order, total: data.total, items: data.items });
    }

    function renderConfirm(order){
      app.innerHTML = `
        <div class="topbar">
          <div class="brand"><span class="display">${esc(RESTAURANT)}</span></div>
        </div>

        <div class="confirm-wrap">
          <div class="ticket confirm-ticket">
            <div class="eyebrow">Pedido enviado — ${esc(order.table_name)}</div>
            <div class="ordid">#${esc(order.id.toUpperCase())}</div>
            <ul>
              ${order.items.map(i => `
                <li>
                  <span>${esc(String(i.qty))}× ${esc(i.name)}</span>
                  <span>${fmt(i.price * i.qty)}</span>
                </li>`).join('')}
            </ul>
            <div style="display:flex;justify-content:space-between;font-weight:700;font-size:14px;">
              <span>Total</span>
              <span>${fmt(order.total)}</span>
            </div>
            <div id="status-pill"></div>
          </div>

          <button class="new-order-btn" id="again-btn">
            + Agregar otro pedido a esta mesa
          </button>
        </div>
      `;

      updateStatusPill(order.status);
      document.getElementById('again-btn').onclick = () => {
        for(const k in cart) delete cart[k];
        draw();
      };
      pollStatus(order.id);
    }

    function updateStatusPill(status){
      const el = document.getElementById('status-pill');
      if(!el) return;
      const label =
        status === 'pendiente'  ? 'Pendiente'     :
        status === 'preparando' ? 'En preparación' :
        status === 'listo'      ? '¡Listo!'        : 'Entregado';

      el.innerHTML = `
        <div class="status-pill status-${esc(status === 'entregado' ? 'listo' : status)}">
          ${esc(label)}
        </div>`;
    }

    async function pollStatus(orderId){
      let ultimoEstado = 'pendiente';
      const estados = { pendiente:0, preparando:1, listo:2, entregado:3 };

      const interval = setInterval(async () => {
        if(!document.getElementById('status-pill')){
          clearInterval(interval);
          return;
        }
        const o = await getOrder(orderId);
        if(!o) return;
        if(estados[o.status] >= estados[ultimoEstado]){
          ultimoEstado = o.status;
          updateStatusPill(o.status);
        }
        if(o.status === 'entregado') clearInterval(interval);
      }, 4000);
    }

    draw();
  }

    clearInterval(clockInterval);
    staffInterval = null;
    app.style.padding = '';
    app.style.maxWidth = '';
    await supabase.auth.signOut();
    renderStaffLogin();
  };

  document.getElementById('kds-refresh').onclick = () => tick();

  function timerClass(mins){
    if(mins < 8) return 'kds-timer-ok';
    if(mins < 15) return 'kds-timer-warn';
    return 'kds-timer-late';
  }

  function renderCol(orders, colId, status, actionLabel, actionCls, nextStatus){
    const col = document.getElementById('kds-cards-' + colId);
    const count = document.getElementById('kds-count-' + colId);
    if(!col || !count) return;

    const lista = orders.filter(o => o.status === status)
      .sort((a,b) => new Date(a.createdAt) - new Date(b.createdAt));

    count.textContent = lista.length;

    if(lista.length === 0){
      col.innerHTML = `<div class="kds-empty">Sin pedidos</div>`;
      return;
    }

    col.innerHTML = lista.map(o => {
      const mins = Math.max(0, Math.floor((Date.now() - new Date(o.createdAt).getTime()) / 60000));
      const hora = new Date(o.createdAt).toLocaleTimeString('es-PE',{hour:'2-digit',minute:'2-digit'});
      const items = Array.isArray(o.items) ? o.items : [];

      return `
        <div class="kds-card estado-${status}" data-id="${esc(o.id)}">
          <div class="kds-card-top">
            <div>
              <div class="kds-card-id">#${esc(o.id.slice(0,8).toUpperCase())}</div>
              <div class="kds-card-mesa">${esc(o.table)}</div>
              <div class="kds-card-time">${hora}</div>
            </div>
            <div class="kds-timer ${timerClass(mins)}">${mins}m</div>
          </div>
          <div class="kds-items">
            ${items.map(i => `
              <div class="kds-item">
                <span class="kds-item-qty">${esc(String(i.qty))}</span>
                <div>
                  <div class="kds-item-name">${esc(i.name)}</div>
                </div>
              </div>`).join('')}
          </div>
          ${o.notes ? `<div class="kds-notes">"${esc(o.notes)}"</div>` : ''}
          <button class="kds-action ${actionCls}" data-next="${nextStatus}">
            ${actionLabel}
          </button>
        </div>`;
    }).join('');

    col.querySelectorAll('.kds-card').forEach(card => {
      const btn = card.querySelector('.kds-action');
      btn.onclick = async () => {
        btn.disabled = true;
        btn.textContent = '…';
        const { error } = await supabase
          .from('orders')
          .update({ status: btn.dataset.next })
          .eq('id', card.dataset.id);
        if(error){ btn.disabled = false; btn.textContent = actionLabel; return; }
        await tick();
      };
    });
  }

  async function tick(){
    const { data:{ session: s } } = await supabase.auth.getSession();
    if(!s){
      clearInterval(staffInterval);
      clearInterval(clockInterval);
      staffInterval = null;
      app.style.padding = '';
      app.style.maxWidth = '';
      renderStaffLogin();
      return;
    }
    const orders = await getOrders();
    renderCol(orders, 'pendiente',  'pendiente',  'Empezar preparación', 'kds-action-preparar',  'preparando');
    renderCol(orders, 'preparando', 'preparando', 'Marcar listo',        'kds-action-listo',     'listo');
    renderCol(orders, 'listo',      'listo',      'Entregado',           'kds-action-entregado', 'entregado');
  }

  await tick();
  staffInterval = setInterval(tick, 5000);

  /* Realtime */
  supabase.channel('kds-orders')
    .on('postgres_changes',{ event:'*', schema:'public', table:'orders' },
      async () => { await tick(); })
    .subscribe();
}

      @media(max-width:900px){

    `;
    document.head.appendChild(st);
  }

  if(!document.querySelector('link[href*="tabler-icons"]')){
    const lk = document.createElement('link');
    lk.rel = 'stylesheet';
    lk.href = 'https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css';
    document.head.appendChild(lk);
  }

  app.style.padding = '0';
  app.style.maxWidth = 'none';

  /* Posiciones físicas de las mesas en % del canvas */
  const POSICIONES = {
    1: { x:22, y:30 },
    2: { x:52, y:30 },
    3: { x:22, y:72 },
    4: { x:52, y:72 },
  };

  /* Zonas decorativas del restaurante */
  const ZONAS = [
    { label:'Barra',  left:'70%', top:'12%',  width:'22%', height:'16%' },
    { label:'Caja',   left:'70%', top:'38%',  width:'22%', height:'14%' },
    { label:'Cocina', left:'70%', top:'62%',  width:'22%', height:'22%' },
    { label:'Entrada',left:'2%',  top:'88%',  width:'18%', height:'10%' },
  ];

  app.innerHTML = `
    <div id="mv-layout">
      <div id="mv-topbar">
        <div class="mv-brand">
          <div class="mv-brand-box">MS</div>
          <span class="mv-brand-name">${esc(RESTAURANT)}</span>
          <span class="mv-brand-role">Mesero</span>
        </div>
        <div class="mv-topbar-center">
          <div class="mv-online"><div class="mv-online-dot"></div> En línea</div>
          <div class="mv-clock" id="mv-clock"></div>
        </div>
        <div class="mv-topbar-right">
          <button class="mv-btn" id="mv-refresh"><i class="ti ti-refresh" aria-hidden="true"></i> Actualizar</button>
          <button class="mv-btn" id="mv-logout"><i class="ti ti-logout" aria-hidden="true"></i> Salir</button>
        </div>
      </div>

      <div id="mv-body">
        <div id="mv-mapa-area">

          <div class="mv-view-tabs">
            <button class="mv-view-tab active" data-view="mapa">Mapa</button>
            <button class="mv-view-tab" data-view="lista">Lista</button>
          </div>

          <div class="mv-leyenda">
            <div class="mv-ley-item"><div class="mv-ley-dot" style="background:#e8e4dc;border:1.5px solid #d4cfc4;"></div>Disponible</div>
            <div class="mv-ley-item"><div class="mv-ley-dot" style="background:#5c7a5a;"></div>Activa</div>
            <div class="mv-ley-item"><div class="mv-ley-dot" style="background:#c49520;"></div>Con pedidos pendientes</div>
          </div>

          <!-- MAPA VISUAL -->
          <div class="mv-mapa-canvas" id="mv-mapa-canvas">
            ${ZONAS.map(z => `
              <div class="mv-zona" style="left:${z.left};top:${z.top};width:${z.width};height:${z.height};">
                ${z.label}
              </div>`).join('')}
            <div id="mv-mesas-nodes"></div>
          </div>

          <!-- GRID LISTA -->
          <div class="mv-grid-view" id="mv-grid-view"></div>

          <div class="mv-msg" id="mv-msg"></div>
        </div>

        <!-- PANEL LATERAL -->
        <div id="mv-panel" class="cerrado">
          <div class="mv-panel-inner">
            <div class="mv-panel-head">
              <div>
                <div class="mv-panel-nombre" id="mv-panel-nombre">—</div>
                <div class="mv-panel-estado" id="mv-panel-estado"></div>
              </div>
              <button class="mv-panel-x" id="mv-panel-close">✕</button>
            </div>
            <div class="mv-panel-stats" id="mv-panel-stats"></div>
            <div class="mv-panel-body" id="mv-panel-body"></div>
            <div class="mv-panel-footer" id="mv-panel-footer"></div>
          </div>
        </div>
      </div>
    </div>
  `;

  /* ── Reloj ── */
  function tickClock(){
    const el = document.getElementById('mv-clock');
    if(el) el.textContent = new Date().toLocaleTimeString('es-PE',{hour:'2-digit',minute:'2-digit'});
  }
  tickClock();
  const clockInt = setInterval(tickClock, 30000);

  /* ── Logout ── */
  document.getElementById('mv-logout').onclick = async () => {
    clearInterval(clockInt);
    app.style.padding = '';
    app.style.maxWidth = '';
    await supabase.auth.signOut();
    renderMeseroLogin();
  };

  document.getElementById('mv-refresh').onclick = () => cargarDatos();
  document.getElementById('mv-panel-close').onclick = () => cerrarPanel();

  /* ── Tabs vista ── */
  let vistaActual = 'mapa';
  document.querySelectorAll('.mv-view-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.mv-view-tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      vistaActual = tab.dataset.view;
      const canvas = document.getElementById('mv-mapa-canvas');
      const grid   = document.getElementById('mv-grid-view');
      if(vistaActual === 'mapa'){
        canvas.style.display = '';
        grid.classList.remove('visible');
      } else {
        canvas.style.display = 'none';
        grid.classList.add('visible');
      }
    });
  });

  let datosActuales = { sesiones:[], pedidos:[] };
  let mesaSeleccionada = null;

  /* ── Cargar datos ── */
  async function cargarDatos(){
    const [{ data: sesiones }, { data: pedidos }] = await Promise.all([
      supabase.rpc('get_table_sessions'),
      supabase.from('orders')
        .select('id,table_id,status,items,total,created_at,session_id,notes')
        .in('status',['pendiente','preparando','listo'])
    ]);
    datosActuales = { sesiones: sesiones||[], pedidos: pedidos||[] };
    dibujarMapa();
    dibujarGrid();
    if(mesaSeleccionada !== null) renderPanel(mesaSeleccionada);
  }

  /* ── Helpers de estado ── */
  function estadoMesa(mesa){
    const { sesiones, pedidos } = datosActuales;
    const sesion = sesiones.find(s => Number(s.table_id) === mesa.id && s.status === 'active');
    const pedidosMesa = sesion
      ? pedidos.filter(o => Number(o.table_id) === mesa.id && o.session_id === sesion.id)
      : [];
    const pendientes = pedidosMesa.filter(o => o.status === 'pendiente' || o.status === 'preparando').length;
    const total = pedidosMesa.reduce((s,o) => s + Number(o.total||0), 0);
    const mins  = sesion
      ? Math.max(0, Math.floor((Date.now() - new Date(sesion.started_at).getTime()) / 60000))
      : 0;

    let estado = 'libre';
    if(sesion && pendientes > 0) estado = 'pendiente';
    else if(sesion) estado = 'activa';

    return { sesion, pedidosMesa, pendientes, total, mins, estado };
  }

  /* ── Dibujar mapa ── */
  function dibujarMapa(){
    const nodesEl = document.getElementById('mv-mesas-nodes');
    if(!nodesEl) return;

    nodesEl.innerHTML = MESAS.map(mesa => {
      const pos = POSICIONES[mesa.id] || { x:50, y:50 };
      const { estado, pedidosMesa, pendientes } = estadoMesa(mesa);
      const isSelected = mesaSeleccionada === mesa.id;

      const subTxt = estado === 'libre' ? 'Libre'
        : estado === 'pendiente' ? 'Pendiente'
        : 'Activa';

      return `
        <div class="mv-mesa-node" data-mesa-id="${mesa.id}"
          style="left:${pos.x}%;top:${pos.y}%;">
          <div class="mv-mesa-circle ${estado}${isSelected?' selected':''}">
            ${pendientes > 0 ? `<div class="mv-mesa-badge">${pendientes}</div>` : ''}
            <span class="mv-mesa-num">${mesa.id}</span>
            <span class="mv-mesa-sub">${subTxt}</span>
          </div>
          <div class="mv-mesa-label">${esc(mesa.nombre)}</div>
        </div>`;
    }).join('');

    nodesEl.querySelectorAll('.mv-mesa-node').forEach(node => {
      node.onclick = () => {
        const id = Number(node.dataset.mesaId);
        mesaSeleccionada === id ? cerrarPanel() : abrirPanel(id);
      };
    });
  }

  /* ── Dibujar grid lista ── */
  function dibujarGrid(){
    const grid = document.getElementById('mv-grid-view');
    if(!grid) return;

    grid.innerHTML = MESAS.map(mesa => {
      const { estado, pedidosMesa, pendientes, total, mins, sesion } = estadoMesa(mesa);
      const badgeCls = { libre:'mv-gcb-libre', activa:'mv-gcb-activa', pendiente:'mv-gcb-pendiente' }[estado];
      const badgeTxt = { libre:'Disponible', activa:'Activa', pendiente:'Pendiente' }[estado];

      return `
        <div class="mv-grid-card ${estado}" data-mesa-id="${mesa.id}">
          <div class="mv-gc-top">
            <div class="mv-gc-num">${esc(mesa.nombre)}</div>
            <span class="mv-gc-badge ${badgeCls}">${badgeTxt}</span>
          </div>
          ${sesion ? `
            <div class="mv-gc-stats">
              <div class="mv-gc-stat">
                <div class="mv-gc-stat-val">${pedidosMesa.length}</div>
                <div class="mv-gc-stat-label">Pedidos</div>
              </div>
              <div class="mv-gc-stat">
                <div class="mv-gc-stat-val">${pendientes}</div>
                <div class="mv-gc-stat-label">Pendientes</div>
              </div>
            </div>
            <div class="mv-gc-info">Activa hace ${mins} min · S/ ${total.toFixed(2)}</div>
            <button class="mv-gc-btn mv-gc-btn-cerrar" data-close="${mesa.id}">Cerrar mesa</button>
          ` : `
            <div class="mv-gc-info" style="margin:8px 0 14px;">Sin actividad</div>
            <button class="mv-gc-btn mv-gc-btn-abrir" data-open="${mesa.id}">Abrir mesa</button>
          `}
        </div>`;
    }).join('');

    /* Click en card → panel */
    grid.querySelectorAll('.mv-grid-card').forEach(card => {
      card.addEventListener('click', e => {
        if(e.target.closest('button')) return;
        const id = Number(card.dataset.mesaId);
        mesaSeleccionada === id ? cerrarPanel() : abrirPanel(id);
      });
    });

    /* Botones abrir/cerrar en grid */
    grid.querySelectorAll('[data-open]').forEach(btn => {
      btn.onclick = async e => {
        e.stopPropagation();
        await accionAbrir(Number(btn.dataset.open), btn);
      };
    });
    grid.querySelectorAll('[data-close]').forEach(btn => {
      btn.onclick = async e => {
        e.stopPropagation();
        await accionCerrar(Number(btn.dataset.close), btn);
      };
    });
  }

  /* ── Acciones abrir/cerrar ── */
  async function accionAbrir(mesaId, btn){
    btn.disabled = true; btn.textContent = 'Abriendo…';
    const { error } = await supabase.rpc('open_table_session',{ p_table_id: mesaId });
    if(error){ btn.disabled = false; btn.textContent = 'Abrir mesa'; mostrarMsg('No se pudo abrir la mesa.'); return; }
    mesaSeleccionada = mesaId;
    await cargarDatos();
    abrirPanel(mesaId);
  }

  async function accionCerrar(mesaId, btn){
    const { pedidosMesa, pendientes, sesion } = estadoMesa(MESAS.find(m => m.id === mesaId));
    const ok = pendientes > 0
      ? confirm(`La mesa tiene ${pendientes} pedido(s) en proceso.\n¿Seguro que deseas cerrarla?`)
      : confirm('¿Cerrar esta mesa?');
    if(!ok) return;
    btn.disabled = true; btn.textContent = 'Cerrando…';
    const { error } = await supabase.rpc('close_table_session',{ p_table_id: mesaId });
    if(error){ btn.disabled = false; btn.textContent = 'Cerrar mesa'; mostrarMsg('No se pudo cerrar la mesa.'); return; }
    if(mesaSeleccionada === mesaId) cerrarPanel();
    await cargarDatos();
  }

  function abrirPanel(mesaId){
    mesaSeleccionada = mesaId;

    dibujarMapa();
    dibujarGrid();
  }

  function cerrarPanel(){
    mesaSeleccionada = null;
    document.getElementById('mv-panel').classList.add('cerrado');
    dibujarMapa();
    dibujarGrid();
  }

  function renderPanel(mesaId){
    const mesa = MESAS.find(m => m.id === mesaId);
    const { sesion, pedidosMesa, pendientes, total, mins, estado } = estadoMesa(mesa);

    const estadoColor = estado === 'pendiente' ? '#c49520' : estado === 'activa' ? '#4a6e48' : '#9e9890';
    const estadoTxt   = estado === 'pendiente' ? 'Con pedidos pendientes' : estado === 'activa' ? 'Activa' : 'Disponible';

    document.getElementById('mv-panel-nombre').textContent = mesa?.nombre || `Mesa ${mesaId}`;
    document.getElementById('mv-panel-estado').innerHTML =
      `<span style="color:${estadoColor};">● ${estadoTxt}</span>`;

    /* Stats */
    document.getElementById('mv-panel-stats').innerHTML = sesion ? `
      <div class="mv-ps"><div class="mv-ps-val">${mins}</div><div class="mv-ps-label">Min</div></div>
      <div class="mv-ps"><div class="mv-ps-val">${pedidosMesa.length}</div><div class="mv-ps-label">Pedidos</div></div>
      <div class="mv-ps"><div class="mv-ps-val" style="font-size:14px;">S/${total.toFixed(0)}</div><div class="mv-ps-label">Total</div></div>
    ` : `<div class="mv-ps" style="grid-column:1/-1;text-align:center;"><div class="mv-ps-val" style="font-size:13px;color:#9e9890;">Sin sesión</div></div>`;

    /* Body pedidos */
    const bodyEl = document.getElementById('mv-panel-body');
    if(!sesion){
      bodyEl.innerHTML = `<div class="mv-empty">Mesa disponible.<br>Ábrela cuando llegue el cliente.</div>`;
    } else if(pedidosMesa.length === 0){
      bodyEl.innerHTML = `<div class="mv-empty">Sin pedidos en esta sesión.</div>`;
    } else {
      const pillCls = { pendiente:'mvp-pendiente', preparando:'mvp-preparando', listo:'mvp-listo' };
      const pillTxt = { pendiente:'Pendiente', preparando:'Preparando', listo:'Listo' };
      bodyEl.innerHTML = `
        <div class="mv-panel-sec">Pedidos de esta sesión</div>
        ${pedidosMesa.map(o => {
          const items = Array.isArray(o.items)
            ? o.items.map(i => `${esc(String(i.qty))}× ${esc(i.name)}`).join('<br>')
            : '';
          return `
            <div class="mv-pedido-card">
              <div class="mv-pedido-top">
                <span class="mv-pedido-id">#${esc(o.id.slice(0,8).toUpperCase())}</span>
                <span class="mv-pedido-pill ${pillCls[o.status]||''}">${pillTxt[o.status]||o.status}</span>
              </div>
              <div class="mv-pedido-items">${items}</div>
              ${o.notes ? `<div style="font-size:11px;color:#9e9890;font-style:italic;margin-top:4px;">"${esc(o.notes)}"</div>` : ''}
              <div class="mv-pedido-total">S/ ${Number(o.total).toFixed(2)}</div>
            </div>`;
        }).join('')}`;
    }

    /* Footer */
    const footerEl = document.getElementById('mv-panel-footer');
    if(sesion){
      footerEl.innerHTML = `
        <button class="mv-pfooter-btn mv-pfooter-cerrar" id="mv-fp-cerrar">
          <i class="ti ti-lock" aria-hidden="true"></i> Cerrar mesa
        </button>`;
      document.getElementById('mv-fp-cerrar').onclick = async () => {
        await accionCerrar(mesaId, document.getElementById('mv-fp-cerrar'));
      };
    } else {
      footerEl.innerHTML = `
        <button class="mv-pfooter-btn mv-pfooter-abrir" id="mv-fp-abrir">
          <i class="ti ti-lock-open" aria-hidden="true"></i> Abrir mesa
        </button>`;
      document.getElementById('mv-fp-abrir').onclick = async () => {
        await accionAbrir(mesaId, document.getElementById('mv-fp-abrir'));
      };
    }
  }

  function mostrarMsg(txt){
    const el = document.getElementById('mv-msg');
    if(!el) return;
    el.textContent = txt;
    setTimeout(() => { if(el.textContent === txt) el.textContent = ''; }, 4000);
  }

  /* Carga inicial */
  await cargarDatos();

  /* Realtime */
  supabase.channel('mv-realtime')
    .on('postgres_changes',{ event:'*', schema:'public', table:'orders' },
      async () => { await cargarDatos(); })
    .on('postgres_changes',{ event:'*', schema:'public', table:'table_sessions' },
      async () => { await cargarDatos(); })
    .subscribe();
}

    app.innerHTML = `

          style="width:100%;padding:13px;margin-bottom:10px;font-family:inherit;">
        <input id="admin-password" type="password" placeholder="Contraseña"
          style="width:100%;padding:13px;margin-bottom:15px;font-family:inherit;">

        <button id="admin-login-btn" class="send-btn" style="width:100%;">Entrar</button>
        <div id="admin-login-error" style="margin-top:15px;color:#c1502e;font-size:12px;"></div>
      </div>
    `;

    document.getElementById('admin-login-btn').onclick = async () => {
      const email    = document.getElementById('admin-email').value.trim();
      const password = document.getElementById('admin-password').value;
      const errorEl  = document.getElementById('admin-login-error');
      const btn      = document.getElementById('admin-login-btn');

      errorEl.textContent = '';
      btn.disabled = true;
      btn.textContent = 'Entrando…';

      const { error } = await supabase.auth.signInWithPassword({ email, password });

      if(error){
        errorEl.textContent = 'Correo o contraseña incorrectos.';
        btn.disabled = false;
        btn.textContent = 'Entrar';
        return;
      }

      const { data: { user } } = await supabase.auth.getUser();
      const { data: profile, error: profileError } = await supabase
        .from('profiles')
        .select('role')
        .eq('id', user.id)
        .single();

      if(profileError || !profile || !['admin','superadmin'].includes(profile.role)){
        await supabase.auth.signOut();
        errorEl.textContent = 'Esta cuenta no tiene permisos de administrador.';
        btn.disabled = false;
        btn.textContent = 'Entrar';
        return;
      }

      renderAdministrador();
    };
  }

  /* Cargar Tabler Icons si no están */

  /* Navegación entre páginas */
  let paginaActual = 'inicio';

  /* ── Carga de datos por página ── */
  async function cargarPagina(key){
    if(key === 'inicio') await cargarInicio();
    if(key === 'pedidos') await cargarPedidos();
    if(key === 'menu') await cargarMenu();
    if(key === 'qr') await cargarQR();
  }

  /* ── INICIO ── */
  async function cargarInicio(){
    const inicioDia = new Date(
      new Date().toLocaleDateString('en-CA',{timeZone:'America/Lima'}) + 'T00:00:00-05:00'
    );

    const [{ data: orders }, { data: sesiones }, { data: menuItems }] = await Promise.all([
      supabase.from('orders').select('id,total,status,created_at,items,table_name').gte('created_at', inicioDia.toISOString()).order('created_at',{ascending:false}),
      supabase.rpc('get_table_sessions'),
      supabase.from('menu_items').select('id,active')
    ]);

    const ords = orders || [];
    const sess = sesiones || [];

    const totalVentas = ords.reduce((s,o) => s + Number(o.total||0), 0);
    const ticketProm  = ords.length > 0 ? totalVentas / ords.length : 0;
    const mesasActivas = MESAS.filter(m => sess.find(s => Number(s.table_id) === m.id && s.status === 'active')).length;

    document.getElementById('ds-orders').textContent = ords.length;
    document.getElementById('ds-sales').textContent  = `S/ ${totalVentas.toFixed(2)}`;
    document.getElementById('ds-mesas').textContent  = `${mesasActivas} / ${MESAS.length}`;
    document.getElementById('ds-avg').textContent    = `S/ ${ticketProm.toFixed(2)}`;

    /* Pedidos activos por mesa */
    const pedidosActivos = ords.filter(o => ['pendiente','preparando','listo'].includes(o.status));

    /* Tiles de mesas */
    const tilesEl = document.getElementById('adash-mesas-tiles');
    tilesEl.innerHTML = MESAS.map(mesa => {
      const sesActiva = sess.find(s => Number(s.table_id) === mesa.id && s.status === 'active');
      const pedMesa   = pedidosActivos.filter(o => {
        const sId = sesActiva?.id;
        return Number(o.table_id||0) === mesa.id && (!sId || o.session_id === sId);
      });
      const pend = pedMesa.filter(o => o.status === 'pendiente' || o.status === 'preparando').length;

      let dotCls = 'mtd-libre', badgeCls = 'mtb-libre', badgeTxt = 'Libre', infoTxt = 'Sin actividad';
      if(sesActiva && pend > 0){ dotCls='mtd-pendiente'; badgeCls='mtb-pendiente'; badgeTxt='Pendiente'; infoTxt=`${pend} pendiente${pend>1?'s':''}`; }
      else if(sesActiva){ dotCls='mtd-activa'; badgeCls='mtb-activa'; badgeTxt='Activa'; infoTxt=`${pedMesa.length} pedido${pedMesa.length!==1?'s':''}`; }

      return `
        <div class="mesa-tile">
          <div class="mt-dot ${dotCls}"></div>
          <div>
            <div class="mt-name">${esc(mesa.nombre)}</div>
            <div class="mt-info">${infoTxt}</div>
          </div>
          <span class="mt-badge ${badgeCls}">${badgeTxt}</span>
        </div>`;
    }).join('');

    /* Pedidos recientes */
    const recEl = document.getElementById('adash-recent-orders');
    const recientes = ords.slice(0, 8);
    if(recientes.length === 0){
      recEl.innerHTML = '<div class="dash-loading">Sin pedidos hoy.</div>';
    } else {
      recEl.innerHTML = recientes.map(o => {
        const hora = new Date(o.created_at).toLocaleTimeString('es-PE',{hour:'2-digit',minute:'2-digit'});
        const items = Array.isArray(o.items) ? o.items.map(i => `${i.name} ×${i.qty}`).join(', ') : '';
        const pillCls = o.status==='preparando'?'op-prep':o.status==='listo'?'op-listo':o.status==='pendiente'?'op-pend':'op-entr';
        const pillTxt = o.status==='preparando'?'Preparando':o.status==='listo'?'Listo':o.status==='pendiente'?'Pendiente':'Entregado';
        return `
          <div class="order-row">
            <span class="or-mesa">${esc(o.table_name||'')}</span>
            <span class="or-time">${hora}</span>
            <span class="or-items">${esc(items)}</span>
            <span class="or-total">S/ ${Number(o.total).toFixed(2)}</span>
            <span class="or-pill ${pillCls}">${pillTxt}</span>
          </div>`;
      }).join('');
    }
  }

  /* ── PEDIDOS ── */
  let todosLosPedidos = [];
  async function cargarPedidos(){
    const { data } = await supabase.from('orders').select('*').order('created_at',{ascending:false}).limit(60);
    todosLosPedidos = (data || []).map(o => ({
      id: o.id, table: o.table_name, tableId: o.table_id,
      items: o.items, total: Number(o.total), notes: o.notes||'',
      status: o.status, createdAt: o.created_at
    }));
    renderPedidos(filtroActual);
  }

  function renderPedidos(filtro){
    const lista = filtro === 'todos'
      ? todosLosPedidos
      : todosLosPedidos.filter(o => o.status === filtro);

    const el = document.getElementById('adash-pedidos-list');
    if(lista.length === 0){ el.innerHTML='<div class="dash-loading">Sin pedidos.</div>'; return; }

    const nextLabel = { pendiente:'Empezar preparación', preparando:'Marcar listo', listo:'Marcar entregado' };

    el.innerHTML = lista.slice(0,20).map(o => {
      const hora = new Date(o.createdAt).toLocaleTimeString('es-PE',{hour:'2-digit',minute:'2-digit'});
      const mins = Math.max(0, Math.floor((Date.now()-new Date(o.createdAt).getTime())/60000));
      const items = Array.isArray(o.items) ? o.items.map(i=>`${esc(i.name)} ×${i.qty}`).join(' · ') : '';
      const pillCls = o.status==='preparando'?'op-prep':o.status==='listo'?'op-listo':o.status==='pendiente'?'op-pend':'op-entr';
      const pillTxt = o.status==='preparando'?'En preparación':o.status==='listo'?'Listo':o.status==='pendiente'?'Pendiente':'Entregado';
      const advBtn  = nextLabel[o.status]
        ? `<button class="pc-btn advance" data-id="${esc(o.id)}" data-next="${o.status==='pendiente'?'preparando':o.status==='preparando'?'listo':'entregado'}">${nextLabel[o.status]}</button>`
        : '';

      return `
        <div class="pedido-card">
          <div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:8px;">
            <div>
              <div class="pc-id">Pedido #${esc(o.id.slice(0,8).toUpperCase())}</div>
              <div class="pc-mesa">${esc(o.table)}</div>
              <div class="pc-time">Hace ${mins} min · ${hora}</div>
            </div>
            <span class="or-pill ${pillCls}">${pillTxt}</span>
          </div>
          <div class="pc-items-text">${items}</div>
          ${o.notes ? `<div style="font-size:11px;color:#9e9890;font-style:italic;margin-bottom:6px;">"${esc(o.notes)}"</div>` : ''}
          <div class="pc-foot">
            <span class="pc-total-val">S/ ${o.total.toFixed(2)}</span>
            <div class="pc-actions">${advBtn}</div>
          </div>
        </div>`;
    }).join('');

    el.querySelectorAll('.advance').forEach(btn => {
      btn.onclick = async () => {
        btn.disabled = true;
        btn.textContent = 'Actualizando…';
        await supabase.from('orders').update({status: btn.dataset.next}).eq('id', btn.dataset.id);
        await cargarPedidos();
      };
    });
  }

  /* ── MENÚ ── */
  async function cargarMenu(){
    const { data } = await supabase.from('menu_items').select('*').order('category').order('id');
    const items = data || [];
    const el = document.getElementById('adash-menu-content');

    if(items.length === 0){ el.innerHTML='<div class="dash-loading">Sin productos.</div>'; return; }

    const porCategoria = {};
    items.forEach(it => {
      if(!porCategoria[it.category]) porCategoria[it.category] = [];
      porCategoria[it.category].push(it);
    });

    el.innerHTML = Object.entries(porCategoria).map(([cat, prods]) => `
      <div class="cat-sep">
        <span class="cat-sep-label">${esc(cat)}</span>
        <div class="cat-sep-line"></div>
      </div>
      <div class="menu-grid-dash">
        ${prods.map(p => `
          <div class="menu-card-dash">
            <div class="mc-img"><i class="ti ti-bowl" aria-hidden="true"></i></div>
            <div class="mc-body">
              <div class="mc-cat-label">${esc(p.category)}</div>
              <div class="mc-name">${esc(p.name)}</div>
              <div class="mc-desc">${esc(p.description||'')}</div>
              <div class="mc-row">
                <span class="mc-price">S/ ${Number(p.price).toFixed(2)}</span>
                ${p.active
                  ? `<span class="mc-on"><span class="mc-on-dot"></span> Disponible</span>`
                  : `<span class="mc-off"><span class="mc-off-dot"></span> No disponible</span>`}
              </div>
            </div>
            <div class="mc-actions">
  <button
    class="mc-action-btn edit-product-btn"
    data-id="${p.id}">
    Editar
  </button>

  <button
    class="mc-action-btn del delete-product-btn"
    data-id="${p.id}">
    Eliminar
  </button>
</div>
          </div>`).join('')}
      </div>`).join('');
        /* ============================================================
       EDITAR PRODUCTO
    ============================================================ */

    el.querySelectorAll('.edit-product-btn').forEach(btn => {

      btn.onclick = async () => {

        const id = btn.dataset.id;

        const producto = items.find(p => String(p.id) === String(id));

        if(!producto) return;

        abrirModalProducto(producto);

      };

    });


    /* ============================================================
       ELIMINAR PRODUCTO
    ============================================================ */

    el.querySelectorAll('.delete-product-btn').forEach(btn => {

      btn.onclick = async () => {

        const id = btn.dataset.id;

        const producto = items.find(p => String(p.id) === String(id));

        if(!producto) return;

        const confirmar = confirm(
          `¿Seguro que deseas eliminar "${producto.name}"?`
        );

        if(!confirmar) return;

        btn.disabled = true;
        btn.textContent = 'Eliminando…';

        const { error } = await supabase
          .from('menu_items')
          .delete()
          .eq('id', id);

        if(error){

          console.error('Error eliminando producto:', error);

          alert(
            'No se pudo eliminar el producto.\n\n' +
            error.message
          );

          btn.disabled = false;
          btn.textContent = 'Eliminar';

          return;
        }

        await cargarMenu();

      };

    });
  }

  /* ── QR ── */
  async function cargarQR(){
    const tokens = await getTableTokens();
    const el = document.getElementById('adash-qr-grid');

    el.innerHTML = MESAS.map(m => {
      const td = tokens.find(t => t.table_id === m.id);
      if(!td) return `
        <div class="qr-card-dash">
          <div class="qr-card-name">${esc(m.nombre)}</div>
          <div class="qr-img-wrap" style="color:#c8c5c0;font-size:12px;">Sin token</div>
        </div>`;

      const url = new URL(baseUrl);
      url.search = '';
      url.searchParams.set('token', td.token);
      const qrSrc = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&margin=6&data=${encodeURIComponent(url.toString())}`;

      return `
        <div class="qr-card-dash">
          <div class="qr-card-name">${esc(m.nombre)}</div>
          <div class="qr-img-wrap">
            <img src="${qrSrc}" width="100" height="100" alt="QR ${esc(m.nombre)}" style="display:block;">
          </div>
          <a href="${qrSrc.replace('200x200','400x400')}" download="QR-${esc(m.nombre)}.png" target="_blank">
            <button class="qr-dl-btn">↓ Descargar</button>
          </a>
        </div>`;
    }).join('');
  }

  /* Carga inicial */
  await cargarInicio();
}

  setTimeout(() => {

    const btn = document.createElement('button');

    btn.style.cssText = `

      display: flex;

      font-size: 12px;
      font-weight: 600;

      cursor: pointer;

      box-shadow: 0 5px 20px rgba(0,0,0,.25);

      transition:
        background .15s ease,
        transform .15s ease;
    `;

    btn.onmouseenter = () => {
      btn.style.background = '#302e2a';
      btn.style.transform = 'translateY(-2px)';
    };

    btn.onmouseleave = () => {
      btn.style.background = '#1b1a18';
      btn.style.transform = 'translateY(0)';
    };

    btn.onclick = async () => {

      if(window.staffInterval){
        clearInterval(window.staffInterval);
        window.staffInterval = null;
      }

      btn.remove();

      limpiarApp();

      await renderSuperadmin();

    };

    document.body.appendChild(btn);

  }, 400);

}
