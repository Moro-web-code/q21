          key === 'usuarios' ? 'flex' : 'none';


        if(key === 'inicio'){
          await cargarInicio();
        }

        if(key === 'usuarios'){
          await cargarUsuarios();
        }

        if(key === 'actividad'){
          await cargarActividad();
        }

      });

    });


  /* ============================================================
     MODAL
  ============================================================ */
  const overlay =
    document.getElementById('sa-modal-overlay');


  function limpiarModal(){

    [
      'sa-f-name',
      'sa-f-email',
      'sa-f-pass'
    ].forEach(id => {

      const el = document.getElementById(id);

      if(el){
        el.value = '';
        el.classList.remove('error');
      }

    });


    document.getElementById(
      'sa-f-role'
    ).value = 'mozo';


    document.getElementById(
      'sa-modal-err'
    ).textContent = '';


    const btn =
      document.getElementById('sa-modal-submit');

    btn.disabled = false;
    btn.textContent = 'Crear usuario';


    const pass =
      document.getElementById('sa-f-pass');

    const icon =
      document.querySelector('#sa-f-eye i');

    pass.type = 'password';

    if(icon){
      icon.className = 'ti ti-eye';
    }

  }


  document.getElementById('sa-nuevo-btn').onclick = () => {

    limpiarModal();

    overlay.classList.add('open');

  };


  document.getElementById('sa-modal-x').onclick = () => {

    overlay.classList.remove('open');

  };


  document.getElementById('sa-modal-cancel').onclick = () => {

    overlay.classList.remove('open');

  };


  overlay.addEventListener('click', e => {

    if(e.target === overlay){
      overlay.classList.remove('open');
    }

  });


  /* ============================================================
     MOSTRAR / OCULTAR CONTRASEÑA
  ============================================================ */
  document.getElementById('sa-f-eye').onclick = () => {

    const inp =
      document.getElementById('sa-f-pass');

    const icon =
      document.querySelector('#sa-f-eye i');

    const showing =
      inp.type === 'text';

    inp.type =
      showing ? 'password' : 'text';

    icon.className =
      showing
        ? 'ti ti-eye'
        : 'ti ti-eye-off';

  };


  /* ============================================================
     CREAR USUARIO
  ============================================================ */
  document.getElementById('sa-modal-submit').onclick =
    async () => {

      const name =
        document.getElementById('sa-f-name')
          .value.trim();

      const email =
        document.getElementById('sa-f-email')
          .value.trim();

      const pass =
        document.getElementById('sa-f-pass')
          .value;

      const role =
        document.getElementById('sa-f-role')
          .value;

      const errEl =
        document.getElementById('sa-modal-err');

      const btn =
        document.getElementById('sa-modal-submit');


      errEl.textContent = '';

      document
        .querySelectorAll('.sa-input')
        .forEach(el => el.classList.remove('error'));


      let valid = true;


      if(!name){

        document
          .getElementById('sa-f-name')
          .classList.add('error');

        valid = false;

      }


      if(!email || !email.includes('@')){

        document
          .getElementById('sa-f-email')
          .classList.add('error');

        valid = false;

      }


      if(pass.length < 8){

        document
          .getElementById('sa-f-pass')
          .classList.add('error');

        valid = false;

      }


      if(!valid){

        errEl.textContent =
          'Completa todos los campos correctamente.';

        return;

      }


      btn.disabled = true;
      btn.textContent = 'Creando…';


      try{

        /*
          IMPORTANTE:

          Esta parte utiliza signUp porque el frontend
          solamente dispone de la clave pública de Supabase.

          La creación administrativa definitiva de usuarios
          debería realizarse mediante una Edge Function
          utilizando service_role en el servidor.
        */

        const { data, error } =
          await supabase.auth.signUp({
            email,
            password:pass
          });


        if(error){

          errEl.textContent =
            error.message ||
            'No se pudo crear el usuario.';

          btn.disabled = false;
          btn.textContent = 'Crear usuario';

          return;

        }


        if(!data || !data.user){

          errEl.textContent =
            'Supabase no devolvió el usuario creado.';

          btn.disabled = false;
          btn.textContent = 'Crear usuario';

          return;

        }


        /*
          Guardamos el perfil.

          El nombre se intenta guardar solamente si
          la columna full_name existe en profiles.
          Si tu tabla no tiene esa columna, se utiliza
          únicamente id + role.
        */

        let profileResult =
          await supabase
            .from('profiles')
            .upsert({
              id:data.user.id,
              role:role,
              full_name:name
            });


        /*
          Si full_name no existe en profiles,
          hacemos nuevamente el upsert únicamente
          con las columnas conocidas.
        */

        if(profileResult.error){

          profileResult =
            await supabase
              .from('profiles')
              .upsert({
                id:data.user.id,
                role:role
              });

        }


        if(profileResult.error){

          errEl.textContent =
            'El usuario fue creado, pero no se pudo guardar su rol: ' +
            profileResult.error.message;

          btn.disabled = false;
          btn.textContent = 'Crear usuario';

          return;

        }


        overlay.classList.remove('open');

        limpiarModal();

        await cargarUsuarios();

        await cargarInicio();

      }catch(error){

        console.error(
          'Error creando usuario:',
          error
        );

        errEl.textContent =
          error.message ||
          'Ocurrió un error inesperado.';

        btn.disabled = false;
        btn.textContent = 'Crear usuario';

      }

    };


  /* ============================================================
     CARGAR INICIO
  ============================================================ */
  async function cargarInicio(){

    try{

      const inicioDia =
        new Date(
          new Date().toLocaleDateString(
            'en-CA',
            {timeZone:'America/Lima'}
          ) + 'T00:00:00-05:00'
        );


      const [
        {data:profiles,error:profilesError},
        {data:sesiones,error:sesionesError},
        {data:orders,error:ordersError}
      ] = await Promise.all([

        supabase
          .from('profiles')
          .select('id,role'),

        supabase
          .rpc('get_table_sessions'),

        supabase
          .from('orders')
          .select('id,total,status,created_at')
          .gte(
            'created_at',
            inicioDia.toISOString()
          )

      ]);


      if(profilesError){
        console.error(
          'Error cargando profiles:',
          profilesError
        );
      }

      if(sesionesError){
        console.error(
          'Error cargando sesiones:',
          sesionesError
        );
      }

      if(ordersError){
        console.error(
          'Error cargando pedidos:',
          ordersError
        );
      }


      const profs =
        profiles || [];

      const sess =
        sesiones || [];

      const ords =
        orders || [];


      const mesasActivas =
        Array.isArray(MESAS)
          ? MESAS.filter(m =>
              sess.find(s =>
                Number(s.table_id) === Number(m.id) &&
                s.status === 'active'
              )
            ).length
          : 0;


      const ventas =
        ords.reduce(
          (sum,o) =>
            sum + Number(o.total || 0),
          0
        );


      const admins =
        profs.filter(
          p =>
            p.role === 'admin' ||
            p.role === 'superadmin'
        ).length;


      const staff =
        profs.filter(
          p =>
            p.role === 'cocina' ||
            p.role === 'mozo'
        ).length;


      const set = (id,val) => {

        const el =
          document.getElementById(id);

        if(el){
          el.textContent = val;
        }

      };


      set(
        'sa-s-users',
        profs.length
      );


      set(
        'sa-s-mesas',
        Array.isArray(MESAS)
          ? `${mesasActivas} / ${MESAS.length}`
          : mesasActivas
      );


      set(
        'sa-s-orders',
        ords.length
      );


      set(
        'sa-s-ventas',
        `S/ ${ventas.toFixed(2)}`
      );


      set(
        'sa-s-admins',
        admins
      );


      set(
        'sa-s-staff',
        staff
      );

    }catch(error){

      console.error(
        'Error en cargarInicio:',
        error
      );

    }

  }


  /* ============================================================
     CARGAR USUARIOS
  ============================================================ */
  async function cargarUsuarios(){

    const el =
      document.getElementById(
        'sa-users-content'
      );


    if(!el) return;


    el.innerHTML =
      '<div class="sa-loading">Cargando usuarios…</div>';


    try{

      const {
        data:profiles,
        error
      } = await supabase
        .from('profiles')
        .select('id,role')
        .order('role');


      if(error){

        console.error(
          'Error cargando usuarios:',
          error
        );

        el.innerHTML =
          '<div class="sa-loading">No se pudieron cargar los usuarios.</div>';

        return;

      }


      if(!profiles || profiles.length === 0){

        el.innerHTML =
          '<div class="sa-empty">No hay usuarios registrados.</div>';

        return;

      }


      const rolLabel = {
        superadmin:'Superadmin',
        admin:'Administrador',
        mozo:'Mesero',
        cocina:'Cocina'
      };


      const rolCls = {
        superadmin:'srp-superadmin',
        admin:'srp-admin',
        mozo:'srp-mozo',
        cocina:'srp-cocina'
      };


      el.innerHTML = `

        <div class="sa-table-wrap">

          <table class="sa-table">

            <thead>

              <tr>

                <th>Usuario</th>
                <th>Rol</th>
                <th>Acciones</th>

              </tr>

            </thead>

            <tbody>

              ${profiles.map(p => `

                <tr>

                  <td>

                    <div class="sa-td-name">
                      Usuario
                    </div>

                    <div class="sa-td-id">
                      ${esc(String(p.id).slice(0,16))}…
                    </div>

                  </td>


                  <td>

                    <span class="sa-role-pill ${rolCls[p.role] || 'srp-admin'}">
                      ${esc(
                        rolLabel[p.role] ||
                        p.role ||
                        'Sin rol'
                      )}
                    </span>

                  </td>


                  <td>

                    <div class="sa-td-actions">

                      <select
                        class="sa-action-sel"
                        data-uid="${esc(p.id)}"
                      >

                        <option
                          value="mozo"
                          ${p.role === 'mozo' ? 'selected' : ''}
                        >
                          Mesero
                        </option>

                        <option
                          value="cocina"
                          ${p.role === 'cocina' ? 'selected' : ''}
                        >
                          Cocina
                        </option>

                        <option
                          value="admin"
                          ${p.role === 'admin' ? 'selected' : ''}
                        >
                          Administrador
                        </option>


                      </select>


                      <button
                        class="sa-action-btn save"
                        data-uid="${esc(p.id)}"
                        data-action="save"
                      >
                        Guardar
                      </button>

                    </div>

                  </td>

                </tr>

              `).join('')}

            </tbody>

          </table>

        </div>
      `;


      el
        .querySelectorAll('[data-action="save"]')
        .forEach(btn => {

          btn.onclick = async () => {

            const uid =
              btn.dataset.uid;


            const sel =
              el.querySelector(
                `select[data-uid="${uid}"]`
              );


            if(!sel) return;


            const nuevoRol =
              sel.value;


            btn.disabled = true;
            btn.textContent = 'Guardando…';


            try{

              const {
                error:updateError
              } = await supabase
                .from('profiles')
                .update({
                  role:nuevoRol
                })
                .eq('id',uid);


              if(updateError){

                alert(
                  'No se pudo actualizar el rol: ' +
                  updateError.message
                );

                return;

              }


              await cargarUsuarios();

              await cargarInicio();

            }catch(error){

              console.error(
                'Error actualizando rol:',
                error
              );

              alert(
                'Ocurrió un error al actualizar el rol.'
              );

            }finally{

              btn.disabled = false;
              btn.textContent = 'Guardar';

            }

          };

        });

    }catch(error){

      console.error(
        'Error en cargarUsuarios:',
        error
      );

      el.innerHTML =
        '<div class="sa-loading">No se pudieron cargar los usuarios.</div>';

    }

  }


  /* ============================================================
     CARGAR ACTIVIDAD
  ============================================================ */
  async function cargarActividad(){

    const el =
      document.getElementById(
        'sa-actividad-content'
      );


    if(!el) return;


    el.innerHTML =
      '<div class="sa-loading">Cargando actividad…</div>';


    try{

      const {data:orders,error} =
        await supabase
          .from('orders')
          .select('id,table_id,total,status,created_at')
          .order(
            'created_at',
            {ascending:false}
          )
          .limit(20);


      if(error){

        console.error(
          'Error cargando actividad:',
          error
        );

        el.innerHTML =
          '<div class="sa-empty">No se pudo cargar la actividad.</div>';

        return;

      }


      if(!orders || orders.length === 0){

        el.innerHTML =
          '<div class="sa-empty">No hay actividad registrada.</div>';

        return;

      }


      const statusLabel = {
        pending:'Pendiente',
        confirmed:'Confirmado',
        preparing:'En preparación',
        ready:'Listo',
        delivered:'Entregado',
        completed:'Completado',
        cancelled:'Cancelado'
      };


      el.innerHTML = `

        <div class="sa-activity-list">

          ${orders.map(order => {

            const fecha =
              order.created_at
                ? new Date(
                    order.created_at
                  ).toLocaleString(
                    'es-PE',
                    {
                      day:'2-digit',
                      month:'2-digit',
                      hour:'2-digit',
                      minute:'2-digit'
                    }
                  )
                : 'Sin fecha';


            let dot =
              '#c49520';


            if(
              order.status === 'completed' ||
              order.status === 'delivered'
            ){
              dot = '#5c7a5a';
            }


            if(
              order.status === 'cancelled'
            ){
              dot = '#c1502e';
            }


            return `

              <div class="sa-activity-item">

                <div
                  class="sa-activity-dot"
                  style="background:${dot};"
                ></div>

                <div>

                  <div class="sa-activity-text">

                    Pedido
                    <strong>
                      #${esc(String(order.id).slice(0,8))}
                    </strong>

                    ${
                      order.table_id != null
                      ? ` · Mesa ${esc(String(order.table_id))}`
                      : ''
                    }

                    ·
                    ${
                      statusLabel[order.status] ||
                      order.status ||
                      'Sin estado'
                    }

                    ${
                      order.total != null
                      ? ` · S/ ${Number(order.total).toFixed(2)}`
                      : ''
                    }

                  </div>

                  <div class="sa-activity-time">
                    ${esc(fecha)}
                  </div>

                </div>

              </div>

            `;

          }).join('')}

        </div>

      `;

    }catch(error){

      console.error(
        'Error en cargarActividad:',
        error
      );

      el.innerHTML =
        '<div class="sa-empty">No se pudo cargar la actividad.</div>';

    }

  }


  /* ============================================================
     CARGA INICIAL
  ============================================================ */
  await cargarInicio();

}
/* ============================================================
   ACCESO PRINCIPAL — LOGIN UNIFICADO + CONTROL POR ROL
   REEMPLAZA TU BLOQUE ROUTER ACTUAL COMPLETO POR ESTE
   ============================================================ */

const {
  data: { session: initSession }
} = await supabase.auth.getSession();


/* ============================================================
   1. ACCESO CLIENTE MEDIANTE QR
   ============================================================ */

if(tokenParam){

  const resultado = await getTableByToken(tokenParam);

  if(!resultado.valid){

    if(resultado.reason === 'mesa_inactiva'){

      app.innerHTML = `
        <div class="access-state">
          <div class="access-state-icon">
            <i class="ti ti-lock"></i>
          </div>

          <div class="eyebrow">Mesa no disponible</div>

          <div class="display">
            Mesa cerrada
          </div>

          <p>
            Esta mesa todavía no ha sido habilitada
            para realizar pedidos.
          </p>
        </div>
      `;

    }else{

      app.innerHTML = `
        <div class="access-state">
          <div class="access-state-icon">
            <i class="ti ti-qrcode-off"></i>
          </div>

          <div class="eyebrow">Acceso no válido</div>

          <div class="display">
            Código no reconocido
          </div>

          <p>
            Este código QR no corresponde
            a una mesa válida.
          </p>
        </div>
      `;
    }

    return;
  }


  /*
    IMPORTANTE:
    El cliente entra únicamente mediante token.
    Nunca se utiliza el login del personal.
  */

  bloquearNavegacionMesa(tokenParam);

  renderCustomer(resultado.mesa.id);

  return;
}


/* ============================================================
   2. SIN TOKEN = ACCESO EXCLUSIVO PARA PERSONAL
   ============================================================ */

if(!initSession){

  renderLoginUnificado();

  return;
}


/* ============================================================
   3. EXISTE SESIÓN → OBTENER USUARIO
   ============================================================ */

const {
  data: {
    user
  },
  error: userError
} = await supabase.auth.getUser();


if(userError || !user){

  await supabase.auth.signOut();

  renderLoginUnificado();

  return;
}


/* ============================================================
   4. OBTENER ROL DESDE PROFILES
   ============================================================ */

const {
  data: profile,
  error: profileError
} = await supabase
  .from('profiles')
  .select('role')
  .eq('id', user.id)
  .single();


if(profileError || !profile){

  console.error(
    'No se pudo obtener el perfil:',
    profileError
  );

  await supabase.auth.signOut();

  app.innerHTML = `
    <div class="access-state">
      <div class="access-state-icon">
        <i class="ti ti-shield-x"></i>
      </div>

      <div class="eyebrow">
        Acceso no autorizado
      </div>

      <div class="display">
        Perfil no configurado
      </div>

      <p>
        Tu usuario no tiene un perfil válido
        dentro del sistema.
      </p>

      <button
        class="access-state-btn"
        onclick="location.reload()"
      >
        Volver
      </button>
    </div>
  `;

  return;
}


const rol = String(profile.role || '')
  .trim()
  .toLowerCase();


/* ============================================================
   5. AUTORIZACIÓN REAL POR ROL
   ============================================================ */


/* ------------------------------------------------------------
   SUPERADMIN
   ------------------------------------------------------------ */

if(rol === 'superadmin'){

  renderSuperadmin();

  return;
}


/* ------------------------------------------------------------
   ADMIN
   ------------------------------------------------------------ */

if(rol === 'admin'){

  renderAdministrador();

  return;
}


/* ------------------------------------------------------------
   COCINA
   ------------------------------------------------------------ */

if(rol === 'cocina'){

  renderStaff();

  return;
}


/* ------------------------------------------------------------
   MESERO
   ------------------------------------------------------------ */

if(
  rol === 'mesero' ||
  rol === 'mozo'
){

  renderMesero();

  return;
}


/* ============================================================
   6. ROL DESCONOCIDO
   ============================================================ */

console.error(
  'Rol no reconocido:',
  rol
);

await supabase.auth.signOut();

renderLoginUnificado();

return;


 


  /* ============================================================
   PROTECCIÓN REAL DE LOS PANELES
   ============================================================ */

async function renderSuperadminProtegido(){

  renderSuperadmin();

}


async function renderAdministradorProtegido(){

  renderAdministrador();

}


async function renderCocinaProtegido(){

  renderStaff();

}


async function renderMeseroProtegido(){

  renderMesero();

}



})();
